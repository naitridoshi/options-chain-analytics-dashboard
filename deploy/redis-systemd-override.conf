# Redis systemd override - auto-restart on failure
#
# Install on the server:
#   sudo mkdir -p /etc/systemd/system/redis-server.service.d/
#   sudo cp deploy/redis-systemd-override.conf /etc/systemd/system/redis-server.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart redis-server
#
# Verify:
#   systemctl show redis-server | grep Restart

[Service]
# Always restart Redis if it crashes or is killed
Restart=always
# Wait 5 seconds before restarting (avoid rapid restart loops)
RestartSec=5
# Give Redis 30 seconds to start up before considering it failed
TimeoutStartSec=30
# Give Redis 15 seconds for graceful shutdown
TimeoutStopSec=15
