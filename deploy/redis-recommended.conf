# Redis recommended configuration for this project
#
# Append these settings to your Redis config (usually /etc/redis/redis.conf)
# or create a drop-in: /etc/redis/redis.conf.d/99-options-dashboard.conf
#
# After changes: sudo systemctl restart redis-server

# Increase max clients as safety net (default 10000)
# With pool limits in the app (20 per client), this should rarely be needed
maxclients 10000

# Close idle clients after 5 minutes (reclaim leaked connections)
timeout 300

# TCP keepalive - detect dead connections every 60 seconds
tcp-keepalive 60

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
