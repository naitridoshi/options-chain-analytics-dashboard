<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Scoring - Options Chain Analytics</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #000000;
      --panel-2: #0a0a0a;
      --line: #1e3a5f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { min-height: 100%; background: #000000; }

    body {
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background: #000000;
      min-height: 100vh;
      color: var(--text);
    }

    .page { max-width: 1400px; margin: 8px auto; padding: 0 8px; }

    .card {
      background: #000000;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* Navbar */
    .navbar {
      display: flex; align-items: center; gap: 6px; padding: 10px 16px;
      background: #0a0a0a; border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0;
    }
    .nav-spot-wrap { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .nav-spot-item { display: inline-flex; align-items: center; gap: 3px; }
    .nav-label { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.3px; }
    .nav-val { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
    .nav-val.pos { color: var(--good); }
    .nav-val.neg { color: var(--bad); }
    .nav-sep { width: 1px; height: 16px; background: var(--line); }

    /* Streaming toggle */
    .streaming-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }
    .streaming-toggle span { font-size: 10px; font-weight: 600; color: var(--muted); }
    .toggle-switch {
      width: 34px; height: 18px; border-radius: 9px; background: #1e293b; cursor: pointer;
      position: relative; transition: background 0.2s;
    }
    .toggle-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: #475569; transition: all 0.2s;
    }
    .toggle-switch.active { background: rgba(56,189,248,0.3); }
    .toggle-switch.active::after { left: 18px; background: var(--accent); }

    /* Main Content */
    .main-content { padding: 16px; }

    /* Overall Score Card */
    .score-hero {
      display: flex; align-items: flex-start; gap: 24px; padding: 24px;
      background: linear-gradient(135deg, #0a0f1a 0%, #000 100%);
      border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .score-info { flex: 1; }
    .score-gauge {
      width: 206px; height: 203px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      border: 3px solid var(--line); position: relative;
    }
    .score-gauge-value {
      font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .score-gauge-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
    .score-gauge.bullish { border-color: rgba(34,197,94,0.4); box-shadow: 0 0 30px rgba(34,197,94,0.1); }
    .score-gauge.bullish .score-gauge-value { color: var(--good); }
    .score-gauge.bearish { border-color: rgba(239,68,68,0.4); box-shadow: 0 0 30px rgba(239,68,68,0.1); }
    .score-gauge.bearish .score-gauge-value { color: var(--bad); }
    .score-gauge.neutral { border-color: rgba(251,191,36,0.4); box-shadow: 0 0 30px rgba(251,191,36,0.1); }
    .score-gauge.neutral .score-gauge-value { color: var(--warn); }

    /* OI Summary Card for Scoring Page */
    .oi-summary-card-scoring {
      flex: 0 0 auto;
      padding: 12px 16px;
      background: #000000;
      border: 2px solid #06b6d4;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.35), inset 0 1px 0 rgba(255,255,255,0.05);
      min-height: 202px;
    }

    .oi-summary-card-scoring .card-title {
      font-size: 16px;
      color: #22d3ee;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: underline;
    }

    .oi-summary-card-scoring .oi-summary-headings {
      display: grid;
      grid-template-columns: 50px 1.2fr 1.2fr 1.2fr;
      gap: 8px;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .oi-summary-card-scoring .oi-heading {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      text-align: center;
    }

    .oi-summary-card-scoring .oi-summary-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .oi-summary-card-scoring .oi-row {
      display: grid;
      grid-template-columns: 50px 1.2fr 1.2fr 1.2fr;
      gap: 8px;
      padding: 4px;
      background: rgba(30, 41, 59, 0.3);
      border-radius: 4px;
    }

    .oi-summary-card-scoring .oi-label {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }

    .oi-summary-card-scoring .oi-net {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .oi-summary-card-scoring .oi-net.positive {
      color: #22c55e;
    }

    .oi-summary-card-scoring .oi-net.negative {
      color: #ef4444;
    }

    .oi-summary-card-scoring .oi-call {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .oi-summary-card-scoring .oi-put {
      font-size: 13px;
      font-weight: 700;
      color: #f87171;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .oi-summary-card-scoring .oi-pct-neutral {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .oi-summary-card-scoring .oi-divider {
      background: linear-gradient(90deg, transparent, #22d3ee 20%, #22d3ee 80%, transparent);
      margin: 8px 0;
      height: 1px;
    }

    .oi-summary-card-scoring .oi-levels-row {
      display: flex;
      justify-content: space-around;
      gap: 16px;
    }

    .oi-summary-card-scoring .level-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .oi-summary-card-scoring .level-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: underline;
    }

    .oi-summary-card-scoring .level-value {
      font-size: 14px;
      color: #f8fafc;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .score-hero {
      display: flex; align-items: flex-start; gap: 24px; padding: 24px;
      background: linear-gradient(135deg, #0a0f1a 0%, #000 100%);
      border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .score-info { display: flex; flex: 1; flex-direction: column; justify-content: center; min-height: 202px; align-items: center;}
    .score-trend {
      font-size: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
    }
    .score-trend.bullish { color: var(--good); }
    .score-trend.bearish { color: var(--bad); }
    .score-trend.neutral { color: var(--warn); }
    .score-weights { display: flex; gap: 24px; }
    .weight-item { display: flex; align-items: center; gap: 6px; }
    .weight-dot { width: 8px; height: 8px; border-radius: 50%; }
    .weight-dot.bull { background: var(--good); }
    .weight-dot.bear { background: var(--bad); }
    .weight-text { font-size: 14px; color: var(--muted); font-weight: 600; }
    .weight-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    /* Market Signal Note */
    .market-signal-note {
      margin-top: 14px;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: 1.5px solid;
      display: none;
      width: 100%;
      max-width: 100%;
      word-break: break-word;
      box-sizing: border-box;
      line-height: 1.4;
      animation: notePulse 2.4s ease-in-out infinite;
    }
    @keyframes notePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.70; }
    }
    .market-signal-note.bullish-strong   { color: #22c55e; border-color: rgba(34,197,94,0.5);   background: rgba(34,197,94,0.08); }
    .market-signal-note.bearish-strong   { color: #ef4444; border-color: rgba(239,68,68,0.5);   background: rgba(239,68,68,0.08); }
    .market-signal-note.bull-trap        { color: #ef4444; border-color: rgba(239,68,68,0.5);   background: rgba(239,68,68,0.08); }
    .market-signal-note.bear-trap        { color: #22c55e; border-color: rgba(34,197,94,0.5);   background: rgba(34,197,94,0.08); }
    .market-signal-note.biased-up        { color: #fbbf24; border-color: rgba(251,191,36,0.5);  background: rgba(251,191,36,0.06); }
    .market-signal-note.biased-down      { color: #fbbf24; border-color: rgba(251,191,36,0.5);  background: rgba(251,191,36,0.06); }
    .market-signal-note.wait             { color: #94a3b8; border-color: rgba(148,163,184,0.4); background: rgba(148,163,184,0.06); }
    .strategy-reversal-note {
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: #FF0000;
      display: none;
    }

    /* Breakdown Table */
    .breakdown-section { margin-bottom: 16px; }
    .section-title {
      font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 8px; padding-left: 2px;
    }
    .breakdown-table {
      width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    }
    .breakdown-table th {
      background: #0a0f1a; font-size: 9px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: left;
      border-bottom: 1px solid var(--line);
    }
    .breakdown-table td {
      padding: 10px 12px; font-size: 12px; font-weight: 600;
      border-bottom: 1px solid rgba(30,58,95,0.3); font-variant-numeric: tabular-nums;
    }
    .breakdown-table tr:last-child td { border-bottom: none; }
    .breakdown-table tr:hover td { background: rgba(56,189,248,0.03); }
    .comp-name { color: var(--text); font-weight: 700; }
    .trend-badge {
      display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .trend-badge.bullish { background: rgba(34,197,94,0.15); color: var(--good); }
    .trend-badge.bearish { background: rgba(239,68,68,0.15); color: var(--bad); }
    .score-val { color: var(--text); }
    .weight-val-cell { color: var(--muted); }
    .net-val { font-weight: 800; }
    .net-val.bullish { color: var(--good); }
    .net-val.bearish { color: var(--bad); }
    .detail-arrow { cursor: pointer; color: var(--muted); font-size: 10px; transition: transform 0.2s; display: inline-block; }
    .detail-arrow.open { transform: rotate(90deg); }

    /* Detail rows */
    .detail-row td { padding: 0 !important; }
    .detail-content {
      display: none; padding: 8px 12px 12px 36px; font-size: 11px; color: var(--muted);
      background: rgba(10,15,26,0.5);
    }
    .detail-content.open { display: table-cell; }
    .detail-item { display: inline-block; margin-right: 16px; margin-bottom: 4px; }
    .detail-label { color: var(--muted); font-weight: 600; }
    .detail-value { color: var(--text); font-weight: 700; margin-left: 4px; }

    /* Score bar mini */
    .score-bar-mini {
      display: inline-block; width: 60px; height: 6px; background: #1e293b;
      border-radius: 3px; overflow: hidden; vertical-align: middle; margin-left: 6px;
    }
    .score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
    .score-bar-fill.bullish { background: var(--good); }
    .score-bar-fill.bearish { background: var(--bad); }

    /* Loading */
    .loading { display: flex; justify-content: center; padding: 40px; }
    .spinner {
      width: 24px; height: 24px; border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .score-hero { flex-direction: column; gap: 16px; text-align: center; }
      .score-weights { justify-content: center; flex-wrap: wrap; gap: 12px; }
      .score-gauge { width: 120px; height: 120px; }
      .score-gauge-value { font-size: 26px; }
      .oi-summary-card-scoring { width: 100%; }
      .breakdown-table th, .breakdown-table td { padding: 8px 6px; font-size: 10px; }
      .market-signal-note {
        font-size: 10px;
        letter-spacing: 0.3px;
        padding: 7px 10px;
      }
    }
  </style>
</head>

<script>
  // Navbar
  (function renderNavbar() {
    const pages = [{href:"/historical-scoring",label:"Hist Scoring"},{href:"/scoring",label:"Scoring"},{href:"/dashboard",label:"Dashboard"},{href:"/coi-live",label:"COI Live"},{href:"/heatmap",label:"Heatmap"},{href:"/coi-pcr-live",label:"Ratio"},{href:"/market-breadth",label:"A2D"},{href:"/most-active",label:"Most Active"},{href:"/chart",label:"Chart"}];
    const nav = document.getElementById("navLinks");
    const css = "display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;height:28px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s ease;white-space:nowrap;";
    const activeCss = "background:rgba(56,189,248,0.1);color:var(--accent);border-color:rgba(56,189,248,0.3);";
    const sep = "<div style='width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0;'></div>";
    nav.innerHTML = pages.map(p => {
      const isActive = window.location.pathname === p.href;
      return `<a href="${p.href}" style="${css}${isActive ? activeCss : ''}">${p.label}</a>`;
    }).join(sep);
  })();

  let isStreaming = true;
  let refreshInterval = null;

  function startStreaming() {
    if (refreshInterval) return;
    refreshInterval = setInterval(loadAllData, 10000);
  }

  function stopStreaming() {
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
  }

  // --- SCORING LOGIC ---

  function fmt2(v) { return v !== null && v !== undefined && !isNaN(v) ? (v * 100).toFixed(1) + "%" : "-"; }
  function fmtPct(v) { return v !== null && v !== undefined && !isNaN(v) ? (v).toFixed(1) + "%" : "-"; }

  // Format numbers in Indian numbering system: 1,00,00,000
  function formatIndian(num) {
    if (num === null || num === undefined || Number.isNaN(Number(num))) return "-";
    const numStr = Math.floor(Number(num)).toString();
    if (numStr.length <= 2) return numStr;

    const lastThree = numStr.slice(-3);
    const remaining = numStr.slice(0, -3);
    const withCommas = remaining.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + lastThree;
    return withCommas;
  }

  function fmtIndian(v) {
    if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
    return formatIndian(v);
  }

  // Update OI Summary Card from Dashboard Data
  function updateOiSummary(dashData) {
    if (!dashData) return;

    const latest = dashData.latest;
    const strikes = dashData.strikes || [];

    // Calculate ATM strike
    const spot = latest ? Number(latest.spot_price) : null;
    let atmStrike = null;
    if (spot !== null && strikes.length > 0) {
      atmStrike = strikes.reduce((acc, row) => {
        const sp = Number(row.strike_price);
        if (acc === null) return sp;
        return Math.abs(sp - spot) < Math.abs(acc - spot) ? sp : acc;
      }, null);
    }

    // Calculate OI EFF: Avg COI of ATM ± 6 strikes / Avg Vol of ATM ± 6 strikes × 100 (separate Call and Put)
    if (atmStrike !== null) {
      const atmIdx = strikes.findIndex(r => Number(r.strike_price) === Number(atmStrike));
      if (atmIdx >= 0) {
        const startIdx = Math.max(0, atmIdx - 6);
        const endIdx = Math.min(strikes.length - 1, atmIdx + 6);
        const window = strikes.slice(startIdx, endIdx + 1);
        let callCoiTotal = 0, putCoiTotal = 0;
        let callVolTotal = 0, putVolTotal = 0;
        window.forEach(r => {
          // call_oi_change / put_oi_change represents COI
          callCoiTotal += Math.abs(Number(r.call_oi_change ?? 0));
          putCoiTotal += Math.abs(Number(r.put_oi_change ?? 0));
          callVolTotal += Number(r.call_volume ?? 0);
          putVolTotal += Number(r.put_volume ?? 0);
        });
        const avgCallCoi = callCoiTotal / window.length;
        const avgPutCoi = putCoiTotal / window.length;
        const avgCallVol = callVolTotal / window.length;
        const avgPutVol = putVolTotal / window.length;

        const callOiEff = avgCallVol > 0 ? (avgCallCoi / avgCallVol) * 100 : 0;
        const putOiEff = avgPutVol > 0 ? (avgPutCoi / avgPutVol) * 100 : 0;
        const netOiEff = putOiEff - callOiEff;

        const netEl = document.getElementById("scoringOiSummaryOiEffNet");
        const callEl = document.getElementById("scoringOiSummaryOiEffCall");
        const putEl = document.getElementById("scoringOiSummaryOiEffPut");

        if (netEl) {
          netEl.textContent = netOiEff >= 0 ? `+${netOiEff.toFixed(1)}%` : `${netOiEff.toFixed(1)}%`;
          netEl.className = `oi-net ${netOiEff >= 0 ? 'positive' : 'negative'}`;
        }
        if (callEl) {
          callEl.textContent = `${callOiEff.toFixed(1)}%`;
          callEl.className = "oi-pct-neutral";
        }
        if (putEl) {
          putEl.textContent = `${putOiEff.toFixed(1)}%`;
          putEl.className = "oi-pct-neutral";
        }
      }
    }

    // Calculate OI and COI totals
    let callOiSum = 0, putOiSum = 0, callCoiSum = 0, putCoiSum = 0;
    let maxCallOi = 0, maxPutOi = 0;
    let oiResistanceStrike = null, oiSupportStrike = null;

    strikes.forEach((row) => {
      const callOi = Number(row.call_oi ?? 0);
      const putOi = Number(row.put_oi ?? 0);
      const strike = Number(row.strike_price);

      callOiSum += callOi;
      putOiSum += putOi;
      callCoiSum += Number(row.call_oi_change ?? 0);
      putCoiSum += Number(row.put_oi_change ?? 0);

      if (callOi > maxCallOi) {
        maxCallOi = callOi;
        oiResistanceStrike = strike;
      }
      if (putOi > maxPutOi) {
        maxPutOi = putOi;
        oiSupportStrike = strike;
      }
    });

    // Update COI Row
    const totalCoi = (callCoiSum || 0) + (putCoiSum || 0);
    const coiNet = (putCoiSum || 0) - (callCoiSum || 0);
    const coiCallPct = totalCoi > 0 ? Math.round((callCoiSum / totalCoi) * 100) : "-";
    const coiPutPct = totalCoi > 0 ? Math.round((putCoiSum / totalCoi) * 100) : "-";

    const coiNetEl = document.getElementById("scoringOiSummaryCoiNet");
    if (coiNetEl) {
      coiNetEl.textContent = coiNet >= 0 ? `+${fmtIndian(coiNet)}` : fmtIndian(coiNet);
      coiNetEl.className = `oi-net ${coiNet >= 0 ? 'positive' : 'negative'}`;
    }

    const coiCallPctEl = document.getElementById("scoringOiSummaryCoiCallPct");
    if (coiCallPctEl) {
      coiCallPctEl.textContent = coiCallPct !== "-" ? `${coiCallPct}%` : "-";
      coiCallPctEl.className = "oi-pct-neutral";
    }

    const coiPutPctEl = document.getElementById("scoringOiSummaryCoiPutPct");
    if (coiPutPctEl) {
      coiPutPctEl.textContent = coiPutPct !== "-" ? `${coiPutPct}%` : "-";
      coiPutPctEl.className = "oi-pct-neutral";
    }

    // Update OI Row
    const totalOi = (callOiSum || 0) + (putOiSum || 0);
    const oiNet = (putOiSum || 0) - (callOiSum || 0);
    const oiCallPct = totalOi > 0 ? Math.round((callOiSum / totalOi) * 100) : "-";
    const oiPutPct = totalOi > 0 ? Math.round((putOiSum / totalOi) * 100) : "-";

    const oiNetEl = document.getElementById("scoringOiSummaryOiNet");
    if (oiNetEl) {
      oiNetEl.textContent = oiNet >= 0 ? `+${fmtIndian(oiNet)}` : fmtIndian(oiNet);
      oiNetEl.className = `oi-net ${oiNet >= 0 ? 'positive' : 'negative'}`;
    }

    const oiCallPctEl = document.getElementById("scoringOiSummaryOiCallPct");
    if (oiCallPctEl) {
      oiCallPctEl.textContent = oiCallPct !== "-" ? `${oiCallPct}%` : "-";
      oiCallPctEl.className = "oi-pct-neutral";
    }

    const oiPutPctEl = document.getElementById("scoringOiSummaryOiPutPct");
    if (oiPutPctEl) {
      oiPutPctEl.textContent = oiPutPct !== "-" ? `${oiPutPct}%` : "-";
      oiPutPctEl.className = "oi-pct-neutral";
    }

    // Update Support/Resistance
    const oiSupportEl = document.getElementById("scoringOiSupportStrike");
    if (oiSupportEl) {
      oiSupportEl.textContent = oiSupportStrike !== null ? formatIndian(Math.floor(oiSupportStrike)) : "-";
    }

    const oiResistanceEl = document.getElementById("scoringOiResistanceStrike");
    if (oiResistanceEl) {
      oiResistanceEl.textContent = oiResistanceStrike !== null ? formatIndian(Math.floor(oiResistanceStrike)) : "-";
    }
  }

  // PCR scoring - lookup table from SCORING.xlsx
  const PCR_TABLE = [
    { min: 1.00, max: 1.25, label: "NEUTRAL TO BULLISH", trend: "BULLISH", add: 10, less: 1.00, divide: 0.25, into: 40 },
    { min: 1.25, max: 1.75, label: "MODERATE BULLISH", trend: "BULLISH", add: 51, less: 1.25, divide: 0.50, into: 25 },
    { min: 1.75, max: 2.25, label: "STRONG BULLISH", trend: "BULLISH", add: 76, less: 1.75, divide: 0.50, into: 15 },
    { min: 2.25, max: Infinity, label: "EXTREME BULLISH", trend: "BULLISH", add: 91, less: 2.25, divide: 0.75, into: 10 },
    { min: 0.75, max: 1.00, label: "NEUTRAL TO BEARISH", trend: "BEARISH", add: 10, less: 1.00, divide: 0.25, into: 40 },
    { min: 0.50, max: 0.75, label: "MODERATE BEARISH", trend: "BEARISH", add: 51, less: 0.75, divide: 0.25, into: 30 },
    { min: 0.25, max: 0.50, label: "STRONG BEARISH", trend: "BEARISH", add: 81, less: 0.50, divide: 0.25, into: 10 },
    { min: 0, max: 0.25, label: "EXTREME BEARISH", trend: "BEARISH", add: 91, less: 0.25, divide: 0.25, into: 10 },
  ];

  function lookupPCRSpecore(pcr) {
    if (pcr === null || pcr === undefined || isNaN(Number(pcr))) return { score: 0, trend: "NEUTRAL", label: "-" };
    const v = Number(pcr);
    for (const row of PCR_TABLE) {
      if (v >= row.min && v < row.max) {
        const distance = row.trend === "BULLISH" ? v - row.less : row.less - v;
        const score = Math.min(100, Math.max(0, row.add + (distance / row.divide) * row.into));
        return { score, trend: row.trend, label: row.label };
      }
    }
    return { score: 0, trend: "NEUTRAL", label: "-" };
  }

  function computePCR(latest) {
    const types = [
      { name: "COI PCR", key: "coi_pcr_window", weight: 0.50 },
      { name: "Strength PCR", key: "strength_pcr", weight: 0.30 },
      { name: "ATM PCR", key: "atm_pcr", weight: 0.20 },
    ];
    const details = [];
    let weightedScore = 0;

    // Trend determined by COI PCR alone
    const coiPcr = latest ? latest.coi_pcr_window : null;
    let mainTrend = "NEUTRAL";
    if (coiPcr !== null && coiPcr > 1.0) mainTrend = "BULLISH";
    else if (coiPcr !== null && coiPcr < 1.0) mainTrend = "BEARISH";

    for (const t of types) {
      const pcr = latest ? latest[t.key] : null;
      const lookup = lookupPCRSpecore(pcr);
      weightedScore += lookup.score * t.weight;
      details.push({
        name: t.name,
        value: pcr !== null ? Number(pcr).toFixed(2) + " (" + lookup.label + ")" : "-",
        score: lookup.score / 100,
      });
    }

    return { trend: mainTrend, score: weightedScore / 100, details };
  }

  // A2D scoring
  function computeA2D(advance, decline) {
    const total = advance + decline;
    if (total === 0) return { trend: "NEUTRAL", score: 0, details: [] };
    if (advance >= decline) {
      return { trend: "BULLISH", score: advance / total, details: [{ name: "Advance", value: advance }, { name: "Decline", value: decline }, { name: "Total", value: total }] };
    }
    return { trend: "BEARISH", score: decline / total, details: [{ name: "Advance", value: advance }, { name: "Decline", value: decline }, { name: "Total", value: total }] };
  }

  // Indices scoring
  function computeIndices(indices) {
    const pos = indices.advance || 0;
    const neg = indices.decline || 0;
    const unc = indices.unchanged || 0;
    const total = indices.total || 0;
    if (total === 0) return { trend: "NEUTRAL", score: 0, details: [] };
    if (pos >= neg) {
      return { trend: "BULLISH", score: pos / total, details: [{ name: "Positive", value: pos }, { name: "Negative", value: neg }, { name: "Unchanged", value: unc }] };
    }
    return { trend: "BEARISH", score: neg / total, details: [{ name: "Positive", value: pos }, { name: "Negative", value: neg }, { name: "Unchanged", value: unc }] };
  }

  // Price vs VWAP scoring
  function pvwapScore(pct) {
    const abs = Math.abs(pct);
    if (abs < 0.05) return 0;
    if (abs < 0.10) return 0.25;
    if (abs < 0.15) return 0.50;
    if (abs < 0.20) return 0.75;
    return 1.0;
  }

  function computePriceVWAP(strikes) {
    if (!strikes || strikes.length === 0) return { trend: "NEUTRAL", score: 0, details: [] };

    let callSum = 0, callN = 0, putSum = 0, putN = 0;
    for (const s of strikes) {
      const callLtp = s.call_live_ltp || s.call_ltp;
      const putLtp = s.put_live_ltp || s.put_ltp;
      const callVwap = s.call_live_avg_price;
      const putVwap = s.put_live_avg_price;
      if (callLtp && callVwap) {
        const p = (callLtp - callVwap) / callVwap;
        if (isFinite(p)) { callSum += p; callN++; }
      }
      if (putLtp && putVwap) {
        const p = (putLtp - putVwap) / putVwap;
        if (isFinite(p)) { putSum += p; putN++; }
      }
    }
    const callAvg = callN > 0 ? callSum / callN : 0;
    const putAvg = putN > 0 ? putSum / putN : 0;

    const isBullish = callAvg > putAvg;
    const trend = isBullish ? "BULLISH" : "BEARISH";
    const bullW = isBullish ? 0.70 : 0.30;
    const bearW = isBullish ? 0.30 : 0.70;

    const callScore = pvwapScore(callAvg);
    const putScore = pvwapScore(putAvg);

    const sideScore = isBullish
      ? callScore * bullW + putScore * bearW
      : putScore * bearW + callScore * bullW;

    return {
      trend, score: sideScore,
      details: [
        { name: "Call LTP vs VWAP", value: fmtPct(callAvg * 100), score: callScore },
        { name: "Put LTP vs VWAP", value: fmtPct(putAvg * 100), score: putScore },
        { name: "Bullish Weight", value: (bullW * 100).toFixed(0) + "%" },
        { name: "Bearish Weight", value: (bearW * 100).toFixed(0) + "%" },
      ],
    };
  }

  // COI Ratio scoring
  function coiGapScore(gap) {
    const abs = Math.abs(gap);
    if (abs <= 0.10) return 0.50;
    if (abs <= 0.20) return 0.60;
    if (abs <= 0.35) return 0.70;
    if (abs <= 0.50) return 0.85;
    return 0.95;
  }

  function computeCOIRatio(strikes) {
    if (!strikes || strikes.length === 0) return { trend: "NEUTRAL", score: 0, details: [] };

    let callCoi = 0, putCoi = 0, callOi = 0, putOi = 0;
    for (const s of strikes) {
      callCoi += (s.call_oi_change || 0);
      putCoi += (s.put_oi_change || 0);
      callOi += (s.call_oi || 0);
      putOi += (s.put_oi || 0);
    }
    const totalCoi = callCoi + putCoi;
    const totalOi = callOi + putOi;
    const coiPutPct = totalCoi > 0 ? putCoi / totalCoi : 0.5;
    const coiCallPct = totalCoi > 0 ? callCoi / totalCoi : 0.5;
    const oiPutPct = totalOi > 0 ? putOi / totalOi : 0.5;
    const oiCallPct = totalOi > 0 ? callOi / totalOi : 0.5;

    const coiGap = coiPutPct - coiCallPct;
    const oiGap = oiPutPct - oiCallPct;

    const coiScoreVal = coiGapScore(coiGap);
    const oiScoreVal = coiGapScore(oiGap);
    let finalScore = coiScoreVal * 0.70 + oiScoreVal * 0.30;

    const coiBullish = putCoi > callCoi;
    const oiBullish = putOi > callOi;
    const conflict = coiBullish !== oiBullish;
    if (conflict) finalScore *= 0.85;

    const trend = coiBullish ? "BULLISH" : "BEARISH";

    return {
      trend, score: finalScore,
      details: [
        { name: "COI Put%", value: fmtPct(coiPutPct * 100) },
        { name: "COI Call%", value: fmtPct(coiCallPct * 100) },
        { name: "COI Gap", value: fmtPct(coiGap * 100), score: coiScoreVal },
        { name: "OI Put%", value: fmtPct(oiPutPct * 100) },
        { name: "OI Call%", value: fmtPct(oiCallPct * 100) },
        { name: "OI Gap", value: fmtPct(oiGap * 100), score: oiScoreVal },
        { name: "Conflict", value: conflict ? "Yes (-15%)" : "No" },
      ],
    };
  }

  // Overall score
  function computeOverall(components) {
    const bullComps = components.filter(c => c.trend === "BULLISH");
    const bearComps = components.filter(c => c.trend === "BEARISH");
    const bullCount = bullComps.length;
    const bearCount = bearComps.length;

    const bullWeight = bullComps.reduce((s, c) => s + c.weight, 0);
    const bearWeight = bearComps.reduce((s, c) => s + c.weight, 0);

    const overall = components.reduce((s, c) => s + (c.score * c.weight), 0);
    const trend = bullWeight > bearWeight ? "BULLISH" : bearWeight > bullWeight ? "BEARISH" : "NEUTRAL";

    return { overall, trend, bullWeight, bearWeight, bullCount, bearCount };
  }

  // --- RENDERING ---

  function renderScore(data) {
    const dash = data.dashboard;
    const a2d = data.a2d;
    const breadth = data.breadth;

    const latest = dash ? dash.latest : null;
    const strikes = dash ? dash.strikes : [];

    // Update OI Summary if dashboard data available
    if (dash) {
      updateOiSummary(dash);
    }

    // Compute all 7 components with weights matching matrix:
    // PCR (15%), A2D F&O (10%), A2D Broader (15%), Indices (20%), Sector (20%), Price vs VWAP (5%), COI Ratio (15%)
    const pcr = computePCR(latest);
    const a2dFO = computeA2D(a2d ? a2d.advance_count : 0, a2d ? a2d.decline_count : 0);
    const bmScr = breadth ? breadth.broad_market.scripts : {};
    const slScr = breadth ? breadth.sectoral.scripts : {};
    const totalScrAdv = (bmScr.advance || 0) + (slScr.advance || 0);
    const totalScrDec = (bmScr.decline || 0) + (slScr.decline || 0);
    const a2dBroader = computeA2D(totalScrAdv, totalScrDec);
    const bmIdx = breadth ? breadth.broad_market.indices : {};
    const slIdx = breadth ? breadth.sectoral.indices : {};
    const indices = computeIndices(bmIdx);
    const sectors = computeIndices(slIdx);
    const pvwap = computePriceVWAP(strikes);
    const coiRatio = computeCOIRatio(strikes);

    const components = [
      { name: "PCR", weight: 0.15, ...pcr },
      { name: "A2D F&O", weight: 0.10, ...a2dFO },
      { name: "A2D Broader", weight: 0.15, ...a2dBroader },
      { name: "Indices", weight: 0.20, ...indices },
      { name: "Sectors", weight: 0.20, ...sectors },
      { name: "Price vs VWAP", weight: 0.05, ...pvwap },
      { name: "COI Ratio", weight: 0.15, ...coiRatio },
    ];

    const overall = computeOverall(components);

    // Render overall card
    const gauge = document.getElementById("scoreGauge");
    const trendEl = document.getElementById("overallTrend");
    if (gauge) gauge.className = "score-gauge " + overall.trend.toLowerCase();
    if (trendEl) trendEl.className = "score-trend " + overall.trend.toLowerCase();
    const _scoreValEl = document.getElementById("overallScoreVal");
    if (_scoreValEl) _scoreValEl.textContent = fmt2(overall.overall);
    if (trendEl) trendEl.textContent = overall.trend;
    const _bullWEl = document.getElementById("bullWeight");
    if (_bullWEl) _bullWEl.textContent = fmt2(overall.bullWeight);
    const _bearWEl = document.getElementById("bearWeight");
    if (_bearWEl) _bearWEl.textContent = fmt2(overall.bearWeight);
    const _bullCEl = document.getElementById("bullCount");
    if (_bullCEl) _bullCEl.textContent = overall.bullCount;
    const _bearCEl = document.getElementById("bearCount");
    if (_bearCEl) _bearCEl.textContent = overall.bearCount;

    // --- Compute Trading Strategy & Reversal Note (same logic as dashboard) ---
    const _coiPcr = latest && latest.coi_pcr_window !== null ? Number(latest.coi_pcr_window) : null;
    const _atmPcr = latest && latest.atm_pcr !== null ? Number(latest.atm_pcr) : null;
    const _strPcr = latest && latest.strength_pcr !== null ? Number(latest.strength_pcr) : null;
    let tradingStrategyText = "NEUTRAL";
    if (_coiPcr !== null && _atmPcr !== null && _strPcr !== null) {
      if (_coiPcr > 1.25 && _atmPcr > 1.25 && _strPcr > 1.25) tradingStrategyText = "BUY ON DIPS";
      else if (_coiPcr < 0.70 && _atmPcr < 0.70 && _strPcr < 0.70) tradingStrategyText = "SELL ON RISE";
    }

    const tradingStrategyBias = tradingStrategyText === "BUY ON DIPS" ? "BULLISH" : (tradingStrategyText === "SELL ON RISE" ? "BEARISH" : "NEUTRAL");

    let callOiSum = 0, putOiSum = 0;
    strikes.forEach((r) => {
      callOiSum += Number(r.call_oi ?? 0);
      putOiSum += Number(r.put_oi ?? 0);
    });

    let reversalNoteText = "";
    if (tradingStrategyText === "BUY ON DIPS" && callOiSum > putOiSum) {
      reversalNoteText = "May Reverse From Resistance";
    } else if (tradingStrategyText === "SELL ON RISE" && putOiSum > callOiSum) {
      reversalNoteText = "May Reverse From Support";
    }

    const reversalNoteEl = document.getElementById("strategyReversalNoteScoring");
    if (reversalNoteEl) {
      if (reversalNoteText) {
        reversalNoteEl.textContent = reversalNoteText;
        reversalNoteEl.style.display = "block";
      } else {
        reversalNoteEl.style.display = "none";
      }
    }

    // --- Derive and render the contextual market signal note ---
    const _noteMap = {
      "BULLISH-BEARISH": { text: "BULLS MAY GET TRAP",                                    cls: "bull-trap" },
      "BULLISH-BULLISH": { text: "STRONG BULLISH",                                         cls: "bullish-strong" },
      "BEARISH-BULLISH": { text: "BEARS MAY GET TRAP",                                    cls: "bear-trap" },
      "BEARISH-BEARISH": { text: "STRONG BEARISH",                                         cls: "bearish-strong" },
      "NEUTRAL-BULLISH": { text: "UPSIDE BIASED - WAIT FOR OPTION CHAIN CONFIRMATION",    cls: "biased-up" },
      "NEUTRAL-BEARISH": { text: "DOWNSIDE BIASED - WAIT FOR OPTION CHAIN CONFIRMATION",  cls: "biased-down" },
      "NEUTRAL-NEUTRAL": { text: "WAIT FOR CONFIRMATION",                                 cls: "wait" },
    };
    const _noteKey = tradingStrategyBias + "-" + overall.trend;
    const _noteEntry = _noteMap[_noteKey] || null;
    const _noteEl = document.getElementById("marketSignalNote");
    if (_noteEl) {
      if (_noteEntry) {
        _noteEl.textContent = _noteEntry.text;
        _noteEl.className = "market-signal-note " + _noteEntry.cls;
        _noteEl.style.display = "block";
      } else {
        _noteEl.style.display = "none";
      }
    }

    // Render breakdown table
    const tbody = document.getElementById("breakdownBody");
    const _compLinks = {
      "PCR":           "/coi-pcr-live",
      "A2D F&O":       "/market-breadth",
      "A2D Broader":   "/heatmap",
      "Indices":       "/heatmap",
      "Sectors":       "/heatmap",
      "Price vs VWAP": "/dashboard",
      "COI Ratio":     "/coi-pcr-live",
    };
    tbody.innerHTML = components.map((c, i) => {
      const trendCls = c.trend.toLowerCase();
      const net = c.score * c.weight;
      const detailHtml = c.details.map(d => {
        let v = `<span class="detail-label">${d.name}:</span>`;
        v += `<span class="detail-value">${typeof d.value === 'number' ? d.value : d.value}</span>`;
        if (d.score !== undefined) v += ` <span class="detail-value" style="color:var(--accent)">(${fmt2(d.score)})</span>`;
        return v;
      }).join("&nbsp;&nbsp;|&nbsp;&nbsp;");

      const href = _compLinks[c.name] || null;
      const nameHtml = href
        ? `<a href="${href}" style="color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.2);" onmouseover="this.style.borderBottomColor='currentColor'" onmouseout="this.style.borderBottomColor='rgba(255,255,255,0.2)'">${c.name}</a>`
        : c.name;

      return `
        <tr>
          <td style="text-align:center"><span class="detail-arrow" onclick="toggleDetail(${i})" id="arrow${i}">&#9654;</span></td>
          <td class="comp-name">${nameHtml}</td>
          <td><span class="trend-badge ${trendCls}">${c.trend}</span></td>
          <td class="score-val">${fmt2(c.score)}<div class="score-bar-mini"><div class="score-bar-fill ${trendCls}" style="width:${Math.round(c.score * 100)}%"></div></div></td>
          <td class="weight-val-cell">${Math.round(c.weight * 100)}%</td>
          <td class="net-val ${trendCls}">${fmt2(net)}</td>
        </tr>
        <tr class="detail-row"><td colspan="6"><div class="detail-content" id="detail${i}">${detailHtml}</div></td></tr>
      `;
    }).join("");
  }

  function toggleDetail(i) {
    const el = document.getElementById("detail" + i);
    const arrow = document.getElementById("arrow" + i);
    el.classList.toggle("open");
    arrow.classList.toggle("open");
  }

  // --- DATA LOADING ---

  async function loadAllData() {
    try {
      const [dashRes, a2dRes, breadthRes] = await Promise.all([
        fetch("/api/v1/dashboard/data?symbol=NIFTY", { credentials: "include" }),
        fetch("/api/v1/script-snapshot/advance-decline", { credentials: "include" }),
        fetch("/api/v1/index-snapshot/breadth-summary", { credentials: "include" }),
      ]);
      const [dashJson, a2dJson, breadthJson] = await Promise.all([dashRes.json(), a2dRes.json(), breadthRes.json()]);
      renderScore({
        dashboard: dashJson.success ? dashJson.data : null,
        a2d: a2dJson.success ? a2dJson.data : null,
        breadth: breadthJson.success ? breadthJson.data : null,
      });
    } catch (e) { console.error("Scoring data load failed:", e); }
  }

  async function loadSpotData() {
    try {
      const res = await fetch("/api/v1/spot-data", { credentials: "include" });
      const result = await res.json();
      if (result.success && result.data) {
        const d = result.data;
        const spot = d.spot_price;
        const chg = d.change_from_prev_close;
        const chgPct = d.change_pct_from_prev_close;
        document.getElementById("navSpot").textContent = spot != null ? Number(spot).toLocaleString("en-IN", { maximumFractionDigits: 2 }) : "-";
        if (chg != null) {
          const el = document.getElementById("navChange");
          el.textContent = (chg >= 0 ? "+" : "") + Number(chg).toFixed(2);
          el.className = "nav-val " + (chg >= 0 ? "pos" : "neg");
        }
        if (chgPct != null) {
          const el = document.getElementById("navChangePct");
          el.textContent = (chgPct >= 0 ? "+" : "") + Number(chgPct).toFixed(2) + "%";
          el.className = "nav-val " + (chgPct >= 0 ? "pos" : "neg");
        }
      }
    } catch (e) { console.error("Spot data fetch failed:", e); }
  }

  loadAllData();
  startStreaming();
  loadSpotData();
  setInterval(loadSpotData, 30000);
</script>
</body>
</html>
