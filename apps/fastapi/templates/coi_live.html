<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COI Live - Options Chain Analytics</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --panel-2: #111111;
      --line: #1e3a5f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
      --atm-bg: rgba(56, 189, 248, 0.15);
      --atm-border: rgba(56, 189, 248, 0.4);
      --black: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background: #000000;
    }

    body {
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background: #000000;
      min-height: 100vh;
      color: var(--text);
      font-size: 12px;
    }

    .page { max-width: 100%; margin: 8px auto; padding: 0 8px; }

    .card {
      background: #000000;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    /* Header */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: #000000;
      border-bottom: 1px solid var(--line);
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-label {
      color: var(--muted);
    }

    .meta-value {
      color: var(--text);
      font-weight: 600;
    }

    .meta-value.positive { color: var(--good); }
    .meta-value.negative { color: var(--bad); }

    .streaming-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      width: 36px;
      height: 18px;
      background: #1f2937;
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle-switch.active {
      background: var(--good);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
    }

    .toggle-switch.active::after {
      transform: translateX(18px);
    }

    /* Navbar spot values */
    .nav-spot-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .nav-spot-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .nav-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .nav-val {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .nav-val.pos { color: var(--good); }
    .nav-val.neg { color: var(--bad); }
    .nav-sep {
      width: 1px;
      height: 16px;
      background: var(--line);
    }

    /* Table Container */
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }

    /* COI Table */
    .coi-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .coi-table th,
    .coi-table td {
      padding: 6px 8px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }

    /* Sticky Header */
    .coi-table thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .coi-table th:first-child,
    .coi-table td:first-child {
      position: sticky;
      left: 0;
      background: #0a0a0a;
      z-index: 5;
      border-left: 1px solid var(--line);
    }

    /* Header Rows */
    .coi-table thead tr:first-child th {
      background: #0a0a0a;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      padding: 8px 10px;
      border-bottom: 2px solid var(--line);
    }

    .coi-table thead tr:first-child th.strike-header {
      background: #0d1117;
    }

    .coi-table thead tr:first-child th.strike-header.atm {
      background: #fbbf24 !important;
      color: #000000 !important;
      border-color: #f59e0b;
    }

    .coi-table thead tr:first-child th.live-header {
      background: rgba(34, 197, 94, 0.1);
      color: var(--good);
      border-color: rgba(34, 197, 94, 0.3);
    }

    /* LIVE Header Row - Static colors for Intraday/Weekly */
    .coi-table thead tr.live-header-row th {
      font-weight: 700;
      padding: 8px 10px;
    }

    .coi-table thead tr.live-header-row th.live-time-header {
      background: #0a0a0a;
      border-left: 2px solid var(--good);
    }

    /* Live row - Intraday: Black bg, White font */
    .coi-table thead tr.live-header-row th.live-intraday {
      background: #000000 !important;
      color: #ffffff !important;
    }

    /* Live row - Weekly: Gray bg, Black font */
    .coi-table thead tr.live-header-row th.live-weekly {
      background: #6b7280 !important;
      color: #000000 !important;
    }

    /* Ensure ATM border still works on live row */
    .coi-table thead tr.live-header-row th.live-intraday.atm-strike-live,
    .coi-table thead tr.live-header-row th.live-weekly.atm-strike-live {
      border-left: 3px solid #000000 !important;
      border-right: 3px solid #000000 !important;
    }

    /* Sub-header Row (Intraday/Weekly) */
    .coi-table thead tr.sub-header-row th {
      background: #0a0a0a;
      color: #000000;
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 8px;
    }

    .coi-table thead tr.sub-header-row th.intraday-header {
      background: #f97316 !important;
      color: #000000 !important;
    }

    .coi-table thead tr.sub-header-row th.weekly-header {
      background: #3b82f6 !important;
      color: #ffffff !important;
    }

    /* ATM Strike Column Highlight - Yellow only for strike price header */
    /* Note: Intraday/Weekly sub-headers keep their orange/blue colors */

    /* ATM Strike Column - Black Border on all cells */
    .coi-table thead tr:first-child th.strike-header.atm {
      border-left: 3px solid #000000 !important;
      border-right: 3px solid #000000 !important;
    }

    .coi-table thead tr.live-header-row th.atm-strike-live {
      border-left: 3px solid #000000 !important;
      border-right: 3px solid #000000 !important;
    }

    .coi-table thead tr.sub-header-row th.atm-strike {
      border-left: 3px solid #000000 !important;
      border-right: 3px solid #000000 !important;
    }

    .coi-table tbody td.atm-strike-data {
      border-left: 3px solid #000000 !important;
      border-right: 3px solid #000000 !important;
    }

    /* Sticky Header Rows */
    .coi-table thead tr {
      position: sticky;
    }

    .coi-table thead tr:first-child {
      top: 0;
      z-index: 15;
      background: #0a0a0a;
    }

    .coi-table thead tr:first-child th {
      background: #0a0a0a;
    }

    .coi-table thead tr.live-header-row {
      top: 32px;
      z-index: 14;
      background: #000000;
    }

    .coi-table thead tr.live-header-row th {
      background: #000000;
    }

    .coi-table thead tr.sub-header-row {
      top: 64px;
      z-index: 13;
      background: #0a0a0a;
    }

    .coi-table thead tr.sub-header-row th {
      background: #0a0a0a;
    }

    /* Sticky first column z-index for header rows */
    .coi-table thead tr:first-child th:first-child {
      z-index: 20;
    }

    .coi-table thead tr.live-header-row th:first-child {
      z-index: 19;
    }

    .coi-table thead tr.sub-header-row th:first-child {
      z-index: 18;
    }

    /* Data Rows */
    .coi-table tbody tr {
      background: #000000;
    }

    .coi-table tbody tr:hover {
      background: #0a0a0a;
    }

    .coi-table tbody tr.atm-row {
      background: var(--atm-bg);
    }

    .coi-table tbody tr.atm-row:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .coi-table tbody tr.atm-row td:first-child {
      background: var(--atm-bg);
      border-left: 2px solid var(--accent);
    }

    /* Strike Column */
    .strike-cell {
      font-weight: 700;
      text-align: left;
      min-width: 70px;
    }

    .strike-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .strike-value {
      color: var(--text);
    }

    .atm-badge {
      font-size: 7px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 2px;
      background: var(--accent);
      color: #000;
      text-transform: uppercase;
    }

    /* Live Indicator Animation */
    .live-indicator {
      font-size: 8px;
      color: var(--good);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Value Cells */
    .value-cell {
      min-width: 60px;
    }

    .value-positive {
      background: rgba(74, 222, 128, 0.75);
      color: #000000;
    }

    .value-negative {
      background: rgba(248, 113, 113, 0.75);
      color: #000000;
    }

    .value-neutral {
      color: var(--text);
      background: transparent;
    }

    /* Time Slot Header */
    .time-header {
      min-width: 80px;
    }

    /* Time Column */
    .time-cell {
      font-weight: 600;
      text-align: left;
      min-width: 80px;
      background: #0a0a0a;
      color: var(--text);
    }

    /* Strike Divider - thin dark border after every strike pair */
    .strike-divider {
      box-shadow: inset -2px 0 0 0 #2a4060;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .meta-info {
        flex-wrap: wrap;
        gap: 8px;
      }

      .coi-table th,
      .coi-table td {
        padding: 4px 6px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div id="navbar" style="display:flex;align-items:center;gap:6px;padding:10px 16px;background:#0a0a0a;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;">
        <div id="navLinks" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"></div>
        <div class="nav-spot-wrap">
          <div class="nav-spot-item"><span class="nav-label">Spot</span><span id="navSpot" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="nav-spot-item"><span class="nav-label">Chg</span><span id="navChange" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="nav-spot-item"><span class="nav-label">Chg%</span><span id="navChangePct" class="nav-val">-</span></div>
        </div>
      </div>
      <!-- Controls Bar -->
      <div class="controls-bar">
        <div class="meta-info">
          <div class="meta-item">
            <span class="meta-label">Symbol:</span>
            <span class="meta-value" id="symbolValue">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">ATM:</span>
            <span class="meta-value" id="atmValue">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Date:</span>
            <span class="meta-value" id="dateValue">-</span>
          </div>
        </div>
        <div class="streaming-toggle">
          <span>Auto Refresh</span>
          <div class="toggle-switch active" id="streamingToggle"></div>
        </div>
      </div>

      <!-- Table Container -->
      <div class="table-container" id="tableContainer">
        <div class="loading" id="loadingState">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){var pages=[{href:"/dashboard",label:"Dashboard"},{href:"/heatmap",label:"Heatmap"},{href:"/market-breadth",label:"A2D"},{href:"/most-active",label:"Most Active"},{href:"/coi-live",label:"COI Live"},{href:"/coi-pcr-live",label:"Ratio"}];var nav=document.getElementById("navLinks");if(!nav)return;var css="display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;height:28px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s ease;white-space:nowrap;";var sep="<div style='width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0;'></div>";nav.innerHTML=pages.map(function(p){return"<a href='"+p.href+"' style='"+css+(window.location.pathname===p.href?"background:rgba(56,189,248,0.1);color:var(--accent);border-color:rgba(56,189,248,0.3);":"")+"'>"+p.label+"</a>"}).join(sep)})();
    let isStreaming = true;
    let refreshInterval = null;
    const REFRESH_INTERVAL_MS = 5000;

    function fmt(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      const num = Number(v);
      return num.toLocaleString("en-IN");
    }

    function getValueClass(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "value-neutral";
      const num = Number(v);
      if (num > 0) return "value-positive";
      if (num < 0) return "value-negative";
      return "value-neutral";
    }

    function escHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderTable(data) {
      const container = document.getElementById("tableContainer");

      if (!data || !data.strikes || data.strikes.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128200;</div>
            <div class="empty-state-text">No COI data available. Market may be closed or data not yet captured.</div>
          </div>
        `;
        return;
      }

      // Update header meta
      document.getElementById("symbolValue").textContent = data.instrument?.symbol || "-";
      document.getElementById("atmValue").textContent = data.atm_strike ? fmt(data.atm_strike) : "-";
      document.getElementById("dateValue").textContent = data.market_date || "-";

      const timeSlots = (data.time_slots || []).slice(1); // Skip 9:15, start from 9:20
      const strikes = data.strikes || [];
      const atmStrike = data.atm_strike;

      // Build table HTML - PIVOTED: Time as rows, Strikes as columns
      let html = '<table class="coi-table">';

      // Header Row 1: Time | Strike 1 | Strike 2 | ... | Strike N
      html += '<thead>';
      html += '<tr>';
      html += '<th class="time-header">Time</th>';

      // Strike price columns (each with colspan 2 for Intraday/Weekly)
      for (const strike of strikes) {
        const isAtm = strike.strike_price === atmStrike;
        const headerClass = isAtm ? 'strike-header atm' : 'strike-header';
        html += `<th class="${headerClass} strike-divider" colspan="2">${fmt(strike.strike_price)}</th>`;
      }

      html += '</tr>';

      // LIVE Row - Part of header (above Intraday/Weekly)
      html += '<tr class="live-header-row">';
      html += '<th class="time-header live-time-header"><span class="live-indicator">● LIVE</span></th>';

      for (const strike of strikes) {
        const isAtm = strike.strike_price === atmStrike;
        const atmClass = isAtm ? ' atm-strike-live' : '';
        const liveData = strike.live || { intraday: null, weekly: null };

        html += `<th class="value-cell live-intraday${atmClass}">${fmt(liveData.intraday)}</th>`;
        html += `<th class="value-cell live-weekly${atmClass} strike-divider">${fmt(liveData.weekly)}</th>`;
      }

      html += '</tr>';

      // Header Row 2: | Intraday | Weekly | Intraday | Weekly | ...
      html += '<tr class="sub-header-row">';
      html += '<th></th>'; // Empty for time column

      for (const strike of strikes) {
        const isAtm = strike.strike_price === atmStrike;
        const atmClass = isAtm ? ' atm-strike' : '';
        html += `<th class="intraday-header${atmClass}">Intraday</th>`;
        html += `<th class="weekly-header${atmClass} strike-divider">Weekly</th>`;
      }

      html += '</tr>';
      html += '</thead>';

      // Body rows - time slots only (LIVE row is now in header)
      html += '<tbody>';

      // Render time slot rows
      for (const time of timeSlots) {
        html += '<tr>';
        html += `<td class="time-cell">${escHtml(time)}</td>`;

        // Data cells for each strike
        for (const strike of strikes) {
          const timeData = strike.data?.[time] || { intraday: null, weekly: null };
          const intradayClass = getValueClass(timeData.intraday);
          const weeklyClass = getValueClass(timeData.weekly);

          html += `<td class="value-cell ${intradayClass}">${fmt(timeData.intraday)}</td>`;
          html += `<td class="value-cell ${weeklyClass} strike-divider">${fmt(timeData.weekly)}</td>`;
        }

        html += '</tr>';
      }

      html += '</tbody>';
      html += '</table>';

      container.innerHTML = html;
    }

    async function loadData() {
      try {
        const response = await fetch("/api/v1/coi-live/data", {
          credentials: "include"
        });
        const result = await response.json();

        if (result.success && result.data) {
          renderTable(result.data);
        } else {
          document.getElementById("tableContainer").innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">&#9888;</div>
              <div class="empty-state-text">Failed to load data. Please try again.</div>
            </div>
          `;
        }
      } catch (error) {
        console.error("Failed to load COI Live data:", error);
        document.getElementById("tableContainer").innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#9888;</div>
            <div class="empty-state-text">Failed to load data. Please try again.</div>
          </div>
        `;
      }
    }

    function startStreaming() {
      if (refreshInterval) return;
      refreshInterval = setInterval(loadData, REFRESH_INTERVAL_MS);
    }

    function stopStreaming() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }

    // Event Listeners
    document.getElementById("streamingToggle").addEventListener("click", function() {
      isStreaming = !isStreaming;
      this.classList.toggle("active", isStreaming);
      if (isStreaming) {
        startStreaming();
      } else {
        stopStreaming();
      }
    });

    // Initial load
    loadData();
    startStreaming();

    // Spot data fetcher
    async function loadSpotData() {
      try {
        const res = await fetch("/api/v1/spot-data", { credentials: "include" });
        const result = await res.json();
        if (result.success && result.data) {
          const d = result.data;
          const navSpot = document.getElementById("navSpot");
          const navChange = document.getElementById("navChange");
          const navChangePct = document.getElementById("navChangePct");
          if (d.spot_price !== null && d.spot_price !== undefined) navSpot.textContent = fmt(d.spot_price);
          if (navChange && d.change_from_prev_close !== null && d.change_from_prev_close !== undefined) {
            const v = Number(d.change_from_prev_close);
            navChange.textContent = (v >= 0 ? "+" : "") + fmt(v);
            navChange.className = "nav-val " + (v >= 0 ? "pos" : "neg");
          }
          if (navChangePct && d.change_pct_from_prev_close !== null && d.change_pct_from_prev_close !== undefined) {
            const v = Number(d.change_pct_from_prev_close);
            navChangePct.textContent = (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
            navChangePct.className = "nav-val " + (v >= 0 ? "pos" : "neg");
          }
        }
      } catch (e) { console.error("Spot data fetch failed:", e); }
    }
    loadSpotData();
    setInterval(loadSpotData, 30000);
  </script>
</body>
</html>
