<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COI Live - Options Chain Analytics</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --panel-2: #111111;
      --line: #1e3a5f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
      --atm-bg: rgba(56, 189, 248, 0.15);
      --atm-border: rgba(56, 189, 248, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background: #000000;
    }

    body {
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background: #000000;
      min-height: 100vh;
      color: var(--text);
      font-size: 12px;
    }

    .page { max-width: 100%; margin: 8px auto; padding: 0 8px; }

    .card {
      background: #000000;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #000000;
      border-bottom: 1px solid var(--line);
      border-radius: 6px 6px 0 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #0a0a0a;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      height: 32px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #141414;
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .header-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-label {
      color: var(--muted);
    }

    .meta-value {
      color: var(--text);
      font-weight: 600;
    }

    .meta-value.positive { color: var(--good); }
    .meta-value.negative { color: var(--bad); }

    .streaming-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      width: 36px;
      height: 18px;
      background: #1f2937;
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle-switch.active {
      background: var(--good);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
    }

    .toggle-switch.active::after {
      transform: translateX(18px);
    }

    /* Table Container */
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 140px);
    }

    /* COI Table */
    .coi-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .coi-table th,
    .coi-table td {
      padding: 6px 8px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }

    .coi-table th:first-child,
    .coi-table td:first-child {
      position: sticky;
      left: 0;
      background: #0a0a0a;
      z-index: 2;
      border-left: 1px solid var(--line);
    }

    /* Header Rows */
    .coi-table thead tr:first-child th {
      background: #0a0a0a;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      padding: 8px 10px;
      border-bottom: 2px solid var(--line);
    }

    .coi-table thead tr:first-child th.strike-header {
      background: #0d1117;
    }

    .coi-table thead tr:first-child th.strike-header.atm {
      background: var(--atm-bg);
      color: var(--accent);
      border-color: var(--atm-border);
    }

    .coi-table thead tr:first-child th.live-header {
      background: rgba(34, 197, 94, 0.1);
      color: var(--good);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .coi-table thead tr:nth-child(2) th {
      background: #0a0a0a;
      color: var(--muted);
      font-weight: 600;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 6px;
    }

    .coi-table thead tr:nth-child(2) th.intraday-header {
      color: #fbbf24;
    }

    .coi-table thead tr:nth-child(2) th.weekly-header {
      color: #a78bfa;
    }

    /* Data Rows */
    .coi-table tbody tr {
      background: #000000;
    }

    .coi-table tbody tr:hover {
      background: #0a0a0a;
    }

    .coi-table tbody tr.atm-row {
      background: var(--atm-bg);
    }

    .coi-table tbody tr.atm-row:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .coi-table tbody tr.atm-row td:first-child {
      background: var(--atm-bg);
      border-left: 2px solid var(--accent);
    }

    /* Strike Column */
    .strike-cell {
      font-weight: 700;
      text-align: left;
      min-width: 70px;
    }

    .strike-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .strike-value {
      color: var(--text);
    }

    .atm-badge {
      font-size: 7px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 2px;
      background: var(--accent);
      color: #000;
      text-transform: uppercase;
    }

    /* Live Row */
    .coi-table tbody tr.live-row {
      background: rgba(34, 197, 94, 0.08);
    }

    .coi-table tbody tr.live-row:hover {
      background: rgba(34, 197, 94, 0.12);
    }

    .coi-table tbody tr.live-row td:first-child {
      background: rgba(34, 197, 94, 0.1);
      color: var(--good);
      font-weight: 700;
    }

    .live-indicator {
      font-size: 8px;
      color: var(--good);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Value Cells */
    .value-cell {
      min-width: 60px;
    }

    .value-positive {
      color: var(--good);
    }

    .value-negative {
      color: var(--bad);
    }

    .value-neutral {
      color: var(--muted);
    }

    /* Time Slot Header */
    .time-header {
      min-width: 120px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .meta-info {
        flex-wrap: wrap;
        gap: 8px;
      }

      .coi-table th,
      .coi-table td {
        padding: 4px 6px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <a href="/dashboard" class="back-btn">
            <span>&#8592;</span>
            <span>Back</span>
          </a>
          <h1 class="page-title">COI Live</h1>
          <span class="header-badge" id="liveBadge">LIVE</span>
        </div>
        <div class="header-right">
          <div class="meta-info">
            <div class="meta-item">
              <span class="meta-label">Symbol:</span>
              <span class="meta-value" id="symbolValue">-</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Spot:</span>
              <span class="meta-value" id="spotValue">-</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">ATM:</span>
              <span class="meta-value" id="atmValue">-</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Date:</span>
              <span class="meta-value" id="dateValue">-</span>
            </div>
          </div>
          <div class="streaming-toggle">
            <span>Auto Refresh</span>
            <div class="toggle-switch active" id="streamingToggle"></div>
          </div>
        </div>
      </div>

      <!-- Table Container -->
      <div class="table-container" id="tableContainer">
        <div class="loading" id="loadingState">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isStreaming = true;
    let refreshInterval = null;
    const REFRESH_INTERVAL_MS = 5000;

    function fmt(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      const num = Number(v);
      return num.toLocaleString("en-IN");
    }

    function getValueClass(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "value-neutral";
      const num = Number(v);
      if (num > 0) return "value-positive";
      if (num < 0) return "value-negative";
      return "value-neutral";
    }

    function escHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderTable(data) {
      const container = document.getElementById("tableContainer");

      if (!data || !data.strikes || data.strikes.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128200;</div>
            <div class="empty-state-text">No COI data available. Market may be closed or data not yet captured.</div>
          </div>
        `;
        return;
      }

      // Update header meta
      document.getElementById("symbolValue").textContent = data.instrument?.symbol || "-";
      document.getElementById("spotValue").textContent = data.spot_price ? fmt(data.spot_price) : "-";
      document.getElementById("atmValue").textContent = data.atm_strike ? fmt(data.atm_strike) : "-";
      document.getElementById("dateValue").textContent = data.market_date || "-";

      const timeSlots = data.time_slots || [];
      const strikes = data.strikes || [];

      // Build table HTML
      let html = '<table class="coi-table">';

      // Header Row 1: Strike prices (colspan 2 for each)
      html += '<thead>';
      html += '<tr>';
      html += '<th class="strike-header">Strike</th>';

      // Time slot columns (each with colspan 2 for Intraday/Weekly)
      for (const time of timeSlots) {
        html += `<th class="time-header strike-header" colspan="2">${escHtml(time)}</th>`;
      }

      // Live column
      html += '<th class="live-header" colspan="2">LIVE</th>';
      html += '</tr>';

      // Header Row 2: Intraday/Weekly sub-headers
      html += '<tr>';
      html += '<th></th>'; // Empty for strike column

      for (const time of timeSlots) {
        html += '<th class="intraday-header">Intraday</th>';
        html += '<th class="weekly-header">Weekly</th>';
      }

      // Live sub-headers
      html += '<th class="intraday-header">Intraday</th>';
      html += '<th class="weekly-header">Weekly</th>';
      html += '</tr>';
      html += '</thead>';

      // Body rows - one row per strike
      html += '<tbody>';

      for (const strike of strikes) {
        const isAtm = strike.is_atm;
        const rowClass = isAtm ? 'atm-row' : '';

        html += `<tr class="${rowClass}">`;
        html += '<td class="strike-cell">';
        html += '<div class="strike-label">';
        html += `<span class="strike-value">${fmt(strike.strike_price)}</span>`;
        if (isAtm) {
          html += '<span class="atm-badge">ATM</span>';
        }
        html += '</div>';
        html += '</td>';

        // Time slot data cells
        for (const time of timeSlots) {
          const timeData = strike.data?.[time] || { intraday: null, weekly: null };
          const intradayClass = getValueClass(timeData.intraday);
          const weeklyClass = getValueClass(timeData.weekly);

          html += `<td class="value-cell ${intradayClass}">${fmt(timeData.intraday)}</td>`;
          html += `<td class="value-cell ${weeklyClass}">${fmt(timeData.weekly)}</td>`;
        }

        // Live data cells
        const liveData = strike.live || { intraday: null, weekly: null };
        const liveIntradayClass = getValueClass(liveData.intraday);
        const liveWeeklyClass = getValueClass(liveData.weekly);

        html += `<td class="value-cell ${liveIntradayClass}">${fmt(liveData.intraday)}</td>`;
        html += `<td class="value-cell ${liveWeeklyClass}">${fmt(liveData.weekly)}</td>`;

        html += '</tr>';
      }

      html += '</tbody>';
      html += '</table>';

      container.innerHTML = html;
    }

    async function loadData() {
      try {
        const response = await fetch("/api/v1/coi-live/data", {
          credentials: "include"
        });
        const result = await response.json();

        if (result.success && result.data) {
          renderTable(result.data);
        } else {
          document.getElementById("tableContainer").innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">&#9888;</div>
              <div class="empty-state-text">Failed to load data. Please try again.</div>
            </div>
          `;
        }
      } catch (error) {
        console.error("Failed to load COI Live data:", error);
        document.getElementById("tableContainer").innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#9888;</div>
            <div class="empty-state-text">Failed to load data. Please try again.</div>
          </div>
        `;
      }
    }

    function startStreaming() {
      if (refreshInterval) return;
      refreshInterval = setInterval(loadData, REFRESH_INTERVAL_MS);
    }

    function stopStreaming() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }

    // Event Listeners
    document.getElementById("streamingToggle").addEventListener("click", function() {
      isStreaming = !isStreaming;
      this.classList.toggle("active", isStreaming);
      if (isStreaming) {
        startStreaming();
      } else {
        stopStreaming();
      }
    });

    // Initial load
    loadData();
    startStreaming();
  </script>
</body>
</html>
