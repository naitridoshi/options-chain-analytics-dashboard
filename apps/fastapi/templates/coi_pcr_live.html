<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COI PCR Live - Options Chain Analytics</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --line: #1e3a5f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
      --header-yellow: #fbbf24;
      --blue-bg: #0d1b2a;
      --black-bg: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background: #000000;
    }

    body {
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background: #000000;
      min-height: 100vh;
      color: var(--text);
      font-size: 12px;
    }

    .page { max-width: 100%; margin: 8px auto; padding: 0 8px; }

    .card {
      background: #000000;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #000000;
      border-bottom: 1px solid var(--line);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #0a0a0a;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      height: 32px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #141414;
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .header-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meta-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-label {
      color: var(--muted);
    }

    .meta-value {
      color: var(--text);
      font-weight: 600;
    }

    .streaming-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      width: 36px;
      height: 18px;
      background: #1f2937;
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle-switch.active {
      background: var(--good);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
    }

    .toggle-switch.active::after {
      transform: translateX(18px);
    }

    /* Table Container */
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }

    /* PCR Table */
    .pcr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      border: 1px solid var(--line);
    }

    .pcr-table th,
    .pcr-table td {
      padding: 10px 16px;
      text-align: center;
      border: 1px solid var(--line);
    }

    /* Sticky Header */
    .pcr-table thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .pcr-table th:first-child,
    .pcr-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
    }

    /* Yellow Header Row */
    .pcr-table thead tr {
      background: var(--header-yellow);
    }

    .pcr-table thead th {
      color: #000000;
      font-weight: 700;
      background: var(--header-yellow);
    }

    .pcr-table thead th.time-col {
      text-align: left;
      padding-left: 20px;
    }

    .pcr-table thead th.value-col {
      min-width: 100px;
    }

    .header-main {
      font-size: 14px;
      margin-bottom: 2px;
    }

    .header-sub {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.8;
    }

    /* Body Rows - Blue background before 10:30, Black after */
    .pcr-table tbody tr {
      background: var(--blue-bg);
    }

    .pcr-table tbody tr.after-threshold {
      background: var(--black-bg);
    }

    .pcr-table tbody tr:hover {
      filter: brightness(1.2);
    }

    /* Time Column */
    .pcr-table thead th.time-col {
      position: sticky;
      left: 0;
      z-index: 12;
      background: var(--header-yellow);
    }

    .pcr-table tbody td.time-col {
      text-align: left;
      padding-left: 20px;
      font-weight: 600;
      color: var(--text);
      background: var(--blue-bg);
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .pcr-table tbody tr.after-threshold td.time-col {
      background: var(--black-bg);
    }

    /* Value Columns */
    .pcr-table tbody td.value-col {
      font-weight: 600;
      font-size: 14px;
    }

    /* Dominance Highlighting - Only on shift rows */
    .pcr-table tbody tr.shift-call td {
      background: rgba(239, 68, 68, 0.25);
      color: #fff;
    }

    .pcr-table tbody tr.shift-call td.value-col.call-col {
      color: #fca5a5;
    }

    .pcr-table tbody tr.shift-put td {
      background: rgba(34, 197, 94, 0.25);
      color: #fff;
    }

    .pcr-table tbody tr.shift-put td.value-col.put-col {
      color: #86efac;
    }

    /* Value Colors */
    .value-call {
      color: var(--bad);
    }

    .value-put {
      color: var(--good);
    }

    .value-neutral {
      color: var(--muted);
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .meta-info {
        flex-wrap: wrap;
        gap: 8px;
      }

      .pcr-table th,
      .pcr-table td {
        padding: 8px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div id="navbar" style="display:flex;align-items:center;gap:6px;padding:10px 16px;background:#0a0a0a;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;flex-wrap:wrap;"></div>
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <a href="/dashboard" class="back-btn">
            <span>&#8592;</span>
            <span>Back</span>
          </a>
          <h1 class="page-title">COI PCR Live</h1>
          <span class="header-badge" id="liveBadge">LIVE</span>
        </div>
        <div class="header-right">
          <div class="meta-info">
            <div class="meta-item">
              <span class="meta-label">Symbol:</span>
              <span class="meta-value" id="symbolValue">-</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Date:</span>
              <span class="meta-value" id="dateValue">-</span>
            </div>
          </div>
          <div class="streaming-toggle">
            <span>Auto Refresh</span>
            <div class="toggle-switch active" id="streamingToggle"></div>
          </div>
        </div>
      </div>

      <!-- Table Container -->
      <div class="table-container" id="tableContainer">
        <div class="loading" id="loadingState">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){var pages=[{href:"/dashboard",label:"Dashboard"},{href:"/heatmap",label:"Heatmap"},{href:"/market-breadth",label:"A2D"},{href:"/most-active",label:"Most Active"},{href:"/coi-live",label:"COI Live"},{href:"/coi-pcr-live",label:"Ratio"}];var nav=document.getElementById("navbar");if(!nav)return;var css="display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;height:28px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s ease;white-space:nowrap;";var sep="<div style='width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0;'></div>";nav.innerHTML=pages.map(function(p){return"<a href='"+p.href+"' style='"+css+(window.location.pathname===p.href?"background:rgba(56,189,248,0.1);color:var(--accent);border-color:rgba(56,189,248,0.3);":"")+"'>"+p.label+"</a>"}).join(sep)})();
    let isStreaming = true;
    let refreshInterval = null;
    const REFRESH_INTERVAL_MS = 5000;
    const THRESHOLD_TIME = "10:30"; // Time threshold for background color change

    function fmtPct(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      const num = Number(v);
      return num.toFixed(0) + "%";
    }

    function fmtPcr(v) {
      if (v === null || v === undefined || v === "INF" || v === "-INF") return v || "-";
      if (Number.isNaN(Number(v))) return "-";
      return Number(v).toFixed(2);
    }

    function escHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function isAfterThreshold(timeStr) {
      return timeStr >= THRESHOLD_TIME;
    }

    function renderTable(data) {
      const container = document.getElementById("tableContainer");

      if (!data || !data.data || data.data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128200;</div>
            <div class="empty-state-text">No COI PCR data available. Market may be closed or data not yet captured.</div>
          </div>
        `;
        return;
      }

      // Update header meta
      document.getElementById("symbolValue").textContent = data.instrument?.symbol || "-";
      document.getElementById("dateValue").textContent = data.market_date || "-";

      const current = data.current || {};
      const timeSeriesData = data.data || [];

      // Build table HTML
      let html = '<table class="pcr-table">';

      // Header Row with current values
      html += '<thead>';
      html += '<tr>';
      html += '<th class="time-col">';
      html += '<div class="header-main">TIME</div>';
      html += '</th>';
      html += '<th class="value-col">';
      html += `<div class="header-main">${fmtPct(current.call_pct)}</div>`;
      html += '<div class="header-sub">CALL</div>';
      html += '</th>';
      html += '<th class="value-col">';
      html += `<div class="header-main">${fmtPct(current.put_pct)}</div>`;
      html += '<div class="header-sub">PUT</div>';
      html += '</th>';
      html += '<th class="value-col">';
      html += `<div class="header-main">${fmtPcr(current.coi_pcr)}</div>`;
      html += '<div class="header-sub">COI PCR</div>';
      html += '</th>';
      html += '</tr>';
      html += '</thead>';

      // Body rows
      html += '<tbody>';

      for (const row of timeSeriesData) {
        const time = row.time;
        const callPct = row.call_pct;
        const putPct = row.put_pct;
        const coiPcr = row.coi_pcr;
        const dominance = row.dominance;
        const isShift = row.shift;
        const afterThreshold = isAfterThreshold(time);

        // Determine row class
        let rowClass = afterThreshold ? 'after-threshold' : '';

        if (isShift) {
          if (dominance === 'call') {
            rowClass += ' shift-call';
          } else if (dominance === 'put') {
            rowClass += ' shift-put';
          }
        }

        // Determine value colors
        let callClass = 'value-neutral';
        let putClass = 'value-neutral';

        if (callPct !== null) {
          if (callPct > 50) {
            callClass = 'value-call';
          }
        }

        if (putPct !== null) {
          if (putPct > 50) {
            putClass = 'value-put';
          }
        }

        html += `<tr class="${rowClass}">`;
        html += `<td class="time-col">${escHtml(time)}</td>`;
        html += `<td class="value-col call-col ${callClass}">${fmtPct(callPct)}</td>`;
        html += `<td class="value-col put-col ${putClass}">${fmtPct(putPct)}</td>`;
        html += `<td class="value-col">${fmtPcr(coiPcr)}</td>`;
        html += '</tr>';
      }

      html += '</tbody>';
      html += '</table>';

      container.innerHTML = html;
    }

    async function loadData() {
      try {
        const response = await fetch("/api/v1/coi-pcr-live/data", {
          credentials: "include"
        });
        const result = await response.json();

        if (result.success && result.data) {
          renderTable(result.data);
        } else {
          document.getElementById("tableContainer").innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">&#9888;</div>
              <div class="empty-state-text">Failed to load data. Please try again.</div>
            </div>
          `;
        }
      } catch (error) {
        console.error("Failed to load COI PCR Live data:", error);
        document.getElementById("tableContainer").innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#9888;</div>
            <div class="empty-state-text">Failed to load data. Please try again.</div>
          </div>
        `;
      }
    }

    function startStreaming() {
      if (refreshInterval) return;
      refreshInterval = setInterval(loadData, REFRESH_INTERVAL_MS);
    }

    function stopStreaming() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }

    // Event Listeners
    document.getElementById("streamingToggle").addEventListener("click", function() {
      isStreaming = !isStreaming;
      this.classList.toggle("active", isStreaming);
      if (isStreaming) {
        startStreaming();
      } else {
        stopStreaming();
      }
    });

    // Initial load
    loadData();
    startStreaming();
  </script>
</body>
</html>
