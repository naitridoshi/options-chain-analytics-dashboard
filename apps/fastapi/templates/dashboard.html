<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Options Chain Trading Board</title>
  <style>
    :root {
      --bg: #0a0f18;
      --panel: #10192b;
      --panel-2: #0d1524;
      --line: #223352;
      --text: #e6eefc;
      --muted: #8fa3c7;
      --accent: #27c4ff;
      --good: #1ecf7a;
      --bad: #ff5f6d;
      --warn: #ffcc66;
      --gold: #f2c14e;
      --call-head: #12a150;
      --put-head: #d46d73;
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      background:
        radial-gradient(1300px 420px at 50% -8%, #1a2d4f 0%, transparent 65%),
        linear-gradient(180deg, #090e17 0%, #0a0f18 50%, #08111f 100%);
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background: transparent;
    }

    .page { max-width: 1480px; margin: 12px auto 24px; padding: 0 10px; }

    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }

    .top {
      padding: 10px;
      margin-bottom: 10px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .symbol-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .symbol-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .pill {
      font-size: 11px;
      border: 1px solid var(--line);
      background: #14213a;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .fyers-badge {
      font-size: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .fyers-badge.ok { background: #0f2e22; border-color: #1b6e4a; color: #7af0b7; }
    .fyers-badge.warn { background: #3a1f1f; border-color: #7d3535; color: #ffc4c4; }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .live-indicator.connected {
      background: #0f2e22;
      border: 1px solid #1b6e4a;
      color: #7af0b7;
    }
    .live-indicator.disconnected {
      background: #3a1f1f;
      border: 1px solid #7d3535;
      color: #ffc4c4;
    }
    .live-indicator.connecting {
      background: #2a2f1f;
      border: 1px solid #4a5080;
      color: #a8b8ff;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    input, button, a.link-btn {
      background: #13213b;
      border: 1px solid #27406a;
      color: var(--text);
      border-radius: 8px;
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    input { width: 110px; font-weight: 700; letter-spacing: 0.4px; }

    button {
      background: linear-gradient(180deg, #1b3f6d 0%, #163356 100%);
      border-color: #3466a3;
      cursor: pointer;
      font-weight: 700;
    }

    .status {
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .status.ok { background: #0f2e22; border-color: #1b6e4a; color: #7af0b7; }
    .status.warn { background: #3a1f1f; border-color: #7d3535; color: #ffc4c4; }

    .meta-row {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .meta { color: var(--muted); font-size: 11px; }

    .kpis {
      margin-top: 10px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(240px, 1.2fr) minmax(180px, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .kpi-stack {
      display: grid;
      grid-template-rows: repeat(3, minmax(64px, auto));
      gap: 6px;
    }

    .signal-col {
      display: grid;
      grid-template-rows: repeat(2, minmax(96px, auto));
      gap: 8px;
    }

    .kpi {
      border: 1px solid #284165;
      border-radius: 8px;
      background: #0e1829;
      padding: 7px;
    }

    .kpi .label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .kpi .label.with-tip { display: inline-flex; align-items: center; gap: 4px; }
    .kpi .label-tip {
      position: relative;
      color: #aecdff;
      font-size: 10px;
      border: 1px solid #2a3f64;
      border-radius: 999px;
      padding: 0 5px;
      line-height: 1.4;
      cursor: help;
      text-transform: none;
    }
    .kpi .label-tip .label-tip-pop {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      width: 280px;
      border: 1px solid #2a3f64;
      border-radius: 8px;
      background: #0f1b30;
      color: #d6e3ff;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      padding: 8px;
      line-height: 1.35;
      white-space: normal;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
      z-index: 5;
      pointer-events: none;
    }
    .kpi .label-tip:hover .label-tip-pop,
    .kpi .label-tip:focus .label-tip-pop {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .kpi .val { margin-top: 2px; font-size: 16px; font-weight: 800; }
    .signal-card {
      border-radius: 8px;
      border: 1px solid #284165;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 6px;
      font-weight: 800;
    }
    .signal-card .title {
      font-size: 11px;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      opacity: 0.95;
    }
    .signal-card .value {
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: 0.5px;
    }
    .signal-positive {
      background: #6fd36f;
      border-color: #8ee28e;
      color: #101010;
    }
    .signal-negative {
      background: #f28a8a;
      border-color: #ffb0b0;
      color: #101010;
    }
    .signal-neutral {
      background: #87d8ff;
      border-color: #afe8ff;
      color: #101010;
    }
    .skeleton {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #1a2740;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      animation: shimmer 1.2s infinite;
    }
    .kpi .val.skeleton {
      height: 20px;
      margin-top: 6px;
    }
    .kpi .label.skeleton {
      height: 10px;
      width: 70px;
    }
    .table-skeleton {
      height: 14px;
      width: 100%;
      margin: 3px 0;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .board { padding: 10px; }

    .table-wrap {
      border: 1px solid #274067;
      border-radius: 10px;
      overflow: auto;
      max-height: 68vh;
      background: #0b1322;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 1450px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid #33568b;
      padding: 7px 5px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-align: right;
      white-space: nowrap;
      background: #142340;
    }

    thead th.call { background: #142340; color: var(--text); }
    thead th.put { background: #142340; color: var(--text); }
    thead th.sp { text-align: center; background: #1a2f51; color: var(--gold); }

    tbody td {
      border-bottom: 1px solid #172845;
      padding: 5px 5px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tbody tr:nth-child(odd) { background: #0a1220; }
    tbody tr:nth-child(even) { background: #0c1628; }
    tbody tr:hover { background: #142542; }

    .call-col {}
    .put-col {}

    .sp-cell {
      text-align: center;
      color: #ffe08a;
      font-weight: 800;
      background: #131f35;
    }

    .sp-cell.atm {
      background: linear-gradient(180deg, #3f3200 0%, #2d2500 100%);
      color: #ffe88a;
      outline: 2px solid #ffd84d;
      outline-offset: -2px;
      box-shadow: inset 0 0 0 1px #fff2a8, 0 0 16px rgba(255, 216, 77, 0.55);
      font-weight: 900;
    }

    .atm-row td {
      background: #323d58 !important;
      box-shadow: inset 0 2px 0 #ffd84d, inset 0 -2px 0 #ffd84d;
    }
    .atm-row td:first-child {
      border-left: 2px solid #ffd84d;
    }
    .atm-row td:last-child {
      border-right: 2px solid #ffd84d;
    }

    .pos { color: var(--good); font-weight: 700; }
    .neg { color: var(--bad); font-weight: 700; }

    .live-value {
      transition: background-color 0.15s ease;
    }
    .live-value.flash {
      background-color: rgba(39, 196, 246, 0.3);
    }

    tfoot td {
      position: sticky;
      bottom: 0;
      z-index: 1;
      background: #101a2e;
      border-top: 1px solid #33568b;
      padding: 7px 5px;
      font-weight: 800;
      text-align: right;
    }

    @media (max-width: 1200px) {
      .kpis { grid-template-columns: 1fr; }
      .kpi-stack { grid-template-rows: unset; grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .signal-col { grid-template-rows: unset; grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card top">
      <div class="top-row">
        <div class="symbol-title">
          <div class="symbol-meta">
            <span id="symbolBadge">NIFTY</span>
            <span id="fyersStatusBadge" class="fyers-badge warn">FYERS: CHECKING</span>
            <span id="liveIndicator" class="live-indicator disconnected" style="display: none;">○ DISCONNECTED</span>
          </div>
          <span class="pill">LATEST SNAPSHOT</span>
        </div>
        <div class="actions">
          <a class="link-btn" href="/login">FYERS Login</a>
        </div>
      </div>

      <div id="dataStatus" class="status warn" style="display:none;"></div>
      <div class="meta-row">
        <div id="meta" class="meta">Market date: -</div>
      </div>

      <div class="kpis" id="kpis"></div>
    </div>

    <div class="card board">
      <div class="table-wrap">
        <table id="gridTable">
          <thead>
            <tr>
              <th class="call">RATIO</th>
              <th class="call">COI % CHNG</th>
              <th class="call">OI</th>
              <th class="call">COI</th>
              <th class="call">PRICE CHG</th>
              <th class="call">LTP</th>
              <th class="call">VWAP</th>
              <th class="sp">STRIKE</th>
              <th class="put">VWAP</th>
              <th class="put">LTP</th>
            <th class="put">PRICE CHG</th>
              <th class="put">COI</th>
              <th class="put">OI</th>
              <th class="put">COI % CHNG</th>
              <th class="put">RATIO</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td></td>
              <td></td>
              <td id="footCallOi"></td>
              <td id="footCallCoi"></td>
              <td></td>
              <td></td>
              <td></td>
              <td id="footOiPcr" class="sp-cell"></td>
              <td></td>
              <td></td>
              <td></td>
              <td id="footPutCoi"></td>
              <td id="footPutOi"></td>
              <td></td>
              <td id="footCoiPcr"></td>
            </tr>
          </tfoot>
        </table>
      </div>

    </div>
  </div>

  <script>
    let timerId = null;
    let refreshMs = 5 * 60 * 1000;
    let hasRendered = false;
    let ws = null;
    let reconnectAttempts = 0;
    let strikeToRowMap = {};
    let symbolToRowMap = {};

    function fmt(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return Number(v).toLocaleString();
    }

    function fmt2(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return Number(v).toFixed(2);
    }

    function fmtPcr(v) {
      if (v === null || v === undefined) return "-";
      if (v === "INF") return "∞";
      if (v === "-INF") return "-∞";
      if (Number.isNaN(Number(v))) return "-";
      return Number(v).toFixed(2);
    }

    function fmt2Signed(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return Number(v).toFixed(2);
    }

    function pcrNumber(v) {
      if (v === null || v === undefined || v === "INF" || v === "-INF") return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function renderSignalCard(title, value, tone) {
      return `<div class="signal-card signal-${tone}">
        <div class="title">${title}</div>
        <div class="value">${value}</div>
      </div>`;
    }

    function kpiToneClass(raw) {
      if (raw === null || raw === undefined || Number.isNaN(Number(raw))) return "";
      const n = Number(raw);
      if (n > 0) return "pos";
      if (n < 0) return "neg";
      return "";
    }

    function escHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function signedClass(v) {
      if (v === null || v === undefined || Number(v) === 0) return "";
      return Number(v) > 0 ? "pos" : "neg";
    }

    function safeDivPct(num, den) {
      if (num === null || den === null || den === 0 || den === undefined) return null;
      return (Number(num) / Number(den)) * 100;
    }

    function toIST(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleTimeString("en-IN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Kolkata"
      });
    }

    async function refreshFyersStatus() {
      const statusEl = document.getElementById("fyersStatusBadge");
      try {
        const statusRes = await fetch("/api/v1/fyers/status", { credentials: "include" });
        const statusBody = await statusRes.json();
        const token = statusBody.data || {};
        if (statusRes.ok && token.has_token) {
          statusEl.className = "fyers-badge ok";
          statusEl.textContent = `FYERS ${token.token_date}`;
          return;
        }
        statusEl.className = "fyers-badge warn";
        statusEl.textContent = "FYERS: TOKEN MISSING";
      } catch (e) {
        statusEl.className = "fyers-badge warn";
        statusEl.textContent = "FYERS: STATUS ERROR";
      }
    }

    function showDataStatus(message) {
      const el = document.getElementById("dataStatus");
      el.style.display = "block";
      el.className = "status warn";
      el.textContent = message;
    }

    function showLoadingState() {
      const kpiCardSkeleton = `<div class="kpi"><div class="label skeleton"></div><div class="val skeleton"></div></div>`;
      document.getElementById("kpis").innerHTML = `
        <div class="kpi-stack">${kpiCardSkeleton}${kpiCardSkeleton}${kpiCardSkeleton}</div>
        <div class="signal-col">
          <div class="signal-card"><div class="title skeleton" style="width:120px;height:10px;"></div><div class="value skeleton" style="width:160px;height:24px;"></div></div>
          <div class="signal-card"><div class="title skeleton" style="width:100px;height:10px;"></div><div class="value skeleton" style="width:140px;height:24px;"></div></div>
        </div>
        <div class="kpi-stack">${kpiCardSkeleton}${kpiCardSkeleton}${kpiCardSkeleton}</div>
      `;

      document.querySelector("#gridTable tbody").innerHTML =
        `<tr><td colspan="15" style="padding:14px 8px;">
          <div class="table-skeleton skeleton"></div>
          <div class="table-skeleton skeleton"></div>
          <div class="table-skeleton skeleton"></div>
          <div class="table-skeleton skeleton"></div>
        </td></tr>`;
    }

    function updateLiveIndicator(state) {
      const el = document.getElementById("liveIndicator");
      if (!el) return;
      el.style.display = "inline-flex";
      if (state === "connected") {
        el.className = "live-indicator connected";
        el.textContent = "● LIVE";
      } else if (state === "connecting") {
        el.className = "live-indicator connecting";
        el.textContent = "◐ CONNECTING...";
      } else {
        el.className = "live-indicator disconnected";
        el.textContent = "○ DISCONNECTED";
      }
    }

    function flashCell(cell) {
      cell.classList.add("live-value", "flash");
      setTimeout(() => {
        cell.classList.remove("flash");
      }, 150);
    }

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
        return;
      }

      updateLiveIndicator("connecting");
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${protocol}://${window.location.host}/ws/market-data`);

      ws.onopen = () => {
        console.log("[WS] Connected to live market data stream");
        updateLiveIndicator("connected");
        reconnectAttempts = 0;
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "market_data" && data.data) {
            updateLiveData(data.data);
          }
        } catch (error) {
          console.error("[WS] Message parse error:", error);
        }
      };

      ws.onclose = () => {
        console.log("[WS] Disconnected");
        updateLiveIndicator("disconnected");
        scheduleReconnect();
      };

      ws.onerror = (error) => {
        console.error("[WS] Error:", error);
        updateLiveIndicator("disconnected");
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      if (reconnectAttempts < 10) {
        reconnectAttempts++;
        const delay = Math.min(2 ** reconnectAttempts, 30) * 1000;
        console.log(`[WS] Scheduling reconnect in ${delay}ms`);
        setTimeout(connectWebSocket, delay);
      }
    }

    function updateLiveData(liveData) {
      if (!liveData || !liveData.strikes) {
        console.log("[WS] No live data or strikes");
        return;
      }

      const strikes = liveData.strikes;
      const tbody = document.querySelector("#gridTable tbody");
      if (!tbody) return;

      console.log("[WS] Received strikes:", Object.keys(strikes));
      console.log("[WS] strikeToRowMap keys:", Object.keys(strikeToRowMap));
      console.log("[WS] strikeToRowMap size:", Object.keys(strikeToRowMap).length);

      // Check if map is empty (table might not be rendered yet)
      if (Object.keys(strikeToRowMap).length === 0) {
        console.log("[WS] strikeToRowMap is empty - table may not be rendered yet");
        return;
      }

      for (const [strikePrice, strikeData] of Object.entries(strikes)) {
        const row = strikeToRowMap[strikePrice];
        if (!row) {
          console.log(`[WS] No row found for strike: ${strikePrice}`);
          continue;
        }
        console.log(`[WS] Found row for strike: ${strikePrice}`, strikeData);

        // Update CE data
        if (strikeData.CE) {
          const ce = strikeData.CE;
          const ceLtpEl = row.querySelector(".call-col.ltp-cell");
          const ceVwapEl = row.querySelector(".call-col.vwap-cell");

          if (ceLtpEl && ce.ltp !== undefined && ce.ltp !== null) {
            const oldVal = ceLtpEl.textContent;
            const newVal = fmt2(ce.ltp);
            if (oldVal !== newVal) {
              ceLtpEl.textContent = newVal;
              flashCell(ceLtpEl);
            }
          }

          if (ceVwapEl && ce.avg_price !== undefined && ce.avg_price !== null) {
            const oldVal = ceVwapEl.textContent;
            const newVal = fmt2(ce.avg_price);
            if (oldVal !== newVal) {
              ceVwapEl.textContent = newVal;
              flashCell(ceVwapEl);
            }
          }
        }

        // Update PE data
        if (strikeData.PE) {
          const pe = strikeData.PE;
          const peLtpEl = row.querySelector(".put-col.ltp-cell");
          const peVwapEl = row.querySelector(".put-col.vwap-cell");

          if (peLtpEl && pe.ltp !== undefined && pe.ltp !== null) {
            const oldVal = peLtpEl.textContent;
            const newVal = fmt2(pe.ltp);
            if (oldVal !== newVal) {
              peLtpEl.textContent = newVal;
              flashCell(peLtpEl);
            }
          }

          if (peVwapEl && pe.avg_price !== undefined && pe.avg_price !== null) {
            const oldVal = peVwapEl.textContent;
            const newVal = fmt2(pe.avg_price);
            if (oldVal !== newVal) {
              peVwapEl.textContent = newVal;
              flashCell(peVwapEl);
            }
          }
        }
      }
    }

    async function load() {
      const symbol = (document.getElementById("symbolBadge").textContent || "NIFTY").trim().toUpperCase();
      document.getElementById("symbolBadge").textContent = symbol;
      if (!hasRendered) {
        showLoadingState();
      }
      refreshFyersStatus().catch(() => {});

      let res;
      let body;
      try {
        res = await fetch(`/api/v1/dashboard/data?symbol=${encodeURIComponent(symbol)}&timeline_limit=1`, { credentials: "include" });
        body = await res.json();
      } catch (e) {
        showDataStatus("Dashboard data request failed. Check API logs.");
        return;
      }

      if (!res.ok || !body.success) {
        showDataStatus(`Dashboard API failed with HTTP ${res.status}`);
        return;
      }
      document.getElementById("dataStatus").style.display = "none";

      const data = body.data || {};
      const latest = data.latest;
      const strikes = data.strikes || [];
      refreshMs = (data.refresh_seconds || 300) * 1000;
      const refreshLabel = refreshMs >= 60000
        ? `${(refreshMs / 60000).toFixed(2)}m`
        : `${(refreshMs / 1000).toFixed(0)}s`;

      document.getElementById("meta").textContent =
        `Market date: ${data.market_date || "-"} | Captured (IST): ${latest ? toIST(latest.captured_at) : "-"} | Auto-refresh: ${refreshLabel}`;

      const prevCloseSource = latest && latest.prev_close_captured_at
        ? `Prev close used: ${toIST(latest.prev_close_captured_at)} IST (${latest.prev_close_selection === "exact_close_time" ? "exact market close" : "latest prev market-day snapshot"})`
        : "Previous market-day close snapshot not available";

      const leftKpis = [
        {
          label: "SPOT",
          val: latest ? fmt2(latest.spot_price) : "-",
          raw: latest ? latest.spot_price : null,
        },
        {
          label: "CHANGE",
          val: latest ? fmt2(latest.change_from_prev_close) : "-",
          tip: prevCloseSource,
          raw: latest ? latest.change_from_prev_close : null,
        },
        {
          label: "CHANGE %",
          val: latest ? `${fmt2(latest.change_pct_from_prev_close)}%` : "-",
          tip: prevCloseSource,
          raw: latest ? latest.change_pct_from_prev_close : null,
        },
      ];
      const rightKpis = [
        {
          label: "COI PCR",
          val: latest ? fmtPcr(latest.coi_pcr_window) : "-",
          raw: latest ? pcrNumber(latest.coi_pcr_window) : null,
        },
        {
          label: "ATM PCR",
          val: latest ? fmtPcr(latest.atm_pcr) : "-",
          raw: latest ? pcrNumber(latest.atm_pcr) : null,
        },
        {
          label: "STRENGTH PCR",
          val: latest ? fmtPcr(latest.strength_pcr) : "-",
          raw: latest ? pcrNumber(latest.strength_pcr) : null,
        },
      ];

      const coiPcr = latest ? pcrNumber(latest.coi_pcr_window) : null;
      const atmPcr = latest ? pcrNumber(latest.atm_pcr) : null;
      const strengthPcr = latest ? pcrNumber(latest.strength_pcr) : null;
      const hasAllPcr = coiPcr !== null && atmPcr !== null && strengthPcr !== null;

      let tradingStrategy = { value: "NO TRADE ZONE", tone: "neutral" };
      let dataTrend = { value: "NEUTRAL", tone: "neutral" };

      if (hasAllPcr) {
        const allAboveBuy = coiPcr > 1.25 && atmPcr > 1.25 && strengthPcr > 1.25;
        const allBelowSell = coiPcr < 0.70 && atmPcr < 0.70 && strengthPcr < 0.70;
        const allAbovePositive = allAboveBuy;
        const negativeTrend = coiPcr < 0.75 && atmPcr < 1.00 && strengthPcr < 0.75;

        if (allAboveBuy) tradingStrategy = { value: "BUY ON DIPS", tone: "positive" };
        else if (allBelowSell) tradingStrategy = { value: "SELL ON RISE", tone: "negative" };

        if (allAbovePositive) dataTrend = { value: "POSITIVE", tone: "positive" };
        else if (negativeTrend) dataTrend = { value: "NEGATIVE", tone: "negative" };
      }

      const renderKpiCard = (item) => {
          const labelHtml = item.tip
            ? `<div class="label with-tip">${item.label}<span class="label-tip" tabindex="0">i<span class="label-tip-pop">${escHtml(item.tip)}</span></span></div>`
            : `<div class="label">${item.label}</div>`;
          return `<div class="kpi">${labelHtml}<div class="val ${kpiToneClass(item.raw)}">${item.val}</div></div>`;
      };

      document.getElementById("kpis").innerHTML = `
        <div class="kpi-stack">${leftKpis.map(renderKpiCard).join("")}</div>
        <div class="signal-col">
          ${renderSignalCard("TRADING STRATEGY", tradingStrategy.value, tradingStrategy.tone)}
          ${renderSignalCard("DATA TREND", dataTrend.value, dataTrend.tone)}
        </div>
        <div class="kpi-stack">${rightKpis.map(renderKpiCard).join("")}</div>
      `;
      hasRendered = true;

      const spot = latest ? Number(latest.spot_price) : null;
      let atmStrike = null;
      if (spot !== null && strikes.length > 0) {
        atmStrike = strikes.reduce((acc, row) => {
          const sp = Number(row.strike_price);
          if (acc === null) return sp;
          return Math.abs(sp - spot) < Math.abs(acc - spot) ? sp : acc;
        }, null);
      }

      // Reset row maps
      strikeToRowMap = {};
      symbolToRowMap = {};

      const tbody = document.querySelector("#gridTable tbody");
      tbody.innerHTML = strikes.map((row) => {
        const callCoi = row.call_oi_change ?? 0;
        const putCoi = row.put_oi_change ?? 0;
        const callOi = row.call_oi ?? 0;
        const putOi = row.put_oi ?? 0;

        const totalCoi = Number(callCoi) + Number(putCoi);
        const callRatio = safeDivPct(callCoi, totalCoi);
        const putRatio = safeDivPct(putCoi, totalCoi);

        const callCoiPctChng = safeDivPct(callCoi, Number(callOi) - Number(callCoi));
        const putCoiPctChng = safeDivPct(putCoi, Number(putOi) - Number(putCoi));

        const isAtm = atmStrike !== null && Number(row.strike_price) === Number(atmStrike);
        const strikeFormatted = fmt2(row.strike_price);

        return `
          <tr class="${isAtm ? 'atm-row' : ''}" data-strike="${strikeFormatted}">
            <td class="call-col ${signedClass(callRatio)}">${fmt2(callRatio)}%</td>
            <td class="call-col ${signedClass(callCoiPctChng)}">${fmt2(callCoiPctChng)}%</td>
            <td class="call-col ${signedClass(callOi)}">${fmt(callOi)}</td>
            <td class="call-col ${signedClass(callCoi)}">${fmt(callCoi)}</td>
            <td class="call-col ${signedClass(row.call_ltp_change)}">${fmt2Signed(row.call_ltp_change)}</td>
            <td class="call-col ltp-cell">${fmt2(row.call_ltp)}</td>
            <td class="call-col vwap-cell live-value">-</td>
            <td class="sp-cell ${isAtm ? 'atm' : ''}">${strikeFormatted}</td>
            <td class="put-col vwap-cell live-value">-</td>
            <td class="put-col ltp-cell">${fmt2(row.put_ltp)}</td>
            <td class="put-col ${signedClass(row.put_ltp_change)}">${fmt2Signed(row.put_ltp_change)}</td>
            <td class="put-col ${signedClass(putCoi)}">${fmt(putCoi)}</td>
            <td class="put-col ${signedClass(putOi)}">${fmt(putOi)}</td>
            <td class="put-col ${signedClass(putCoiPctChng)}">${fmt2(putCoiPctChng)}%</td>
            <td class="put-col ${signedClass(putRatio)}">${fmt2(putRatio)}%</td>
          </tr>
        `;
      }).join("");

      // Build row maps for live updates
      tbody.querySelectorAll("tr").forEach((row) => {
        const strikeCell = row.querySelector(".sp-cell");
        if (strikeCell) {
          // Store strike as integer to match WebSocket data format (e.g., "24000" not "24000.00")
          const strikePrice = String(parseInt(strikeCell.textContent, 10));
          strikeToRowMap[strikePrice] = row;
          console.log(`[Dashboard] Mapped strike: ${strikePrice} (from text: "${strikeCell.textContent}")`);
        }
      });
      console.log(`[Dashboard] Built strikeToRowMap with ${Object.keys(strikeToRowMap).length} entries`);

      const callOiSum = latest ? latest.call_oi_sum : null;
      const putOiSum = latest ? latest.put_oi_sum : null;
      const callCoiSum = latest ? latest.call_oi_change_sum : null;
      const putCoiSum = latest ? latest.put_oi_change_sum : null;

      document.getElementById("footCallOi").textContent = "";
      document.getElementById("footPutOi").textContent = "";
      document.getElementById("footCallCoi").textContent = "";
      document.getElementById("footPutCoi").textContent = "";
      document.getElementById("footOiPcr").textContent = latest ? `OI PCR ${fmt2(latest.pcr_oi)}` : "-";
      document.getElementById("footCoiPcr").textContent = latest ? `COI PCR ${fmtPcr(latest.coi_pcr_window)}` : "-";

      // Connect WebSocket for live updates
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connectWebSocket();
      }

      if (timerId) clearTimeout(timerId);
      timerId = setTimeout(load, refreshMs);
    }

    load();
  </script>
</body>
</html>
