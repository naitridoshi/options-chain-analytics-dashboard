<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Options Chain Trading Board</title>
  <style>
    :root {
      --bg: #0a0f18;
      --panel: #10192b;
      --panel-2: #0d1524;
      --line: #223352;
      --text: #e6eefc;
      --muted: #8fa3c7;
      --accent: #27c4ff;
      --good: #1ecf7a;
      --bad: #ff5f6d;
      --warn: #ffcc66;
      --gold: #f2c14e;
      --call-head: #12a150;
      --put-head: #d46d73;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background:
        radial-gradient(1300px 420px at 50% -8%, #1a2d4f 0%, transparent 65%),
        linear-gradient(180deg, #090e17 0%, #0a0f18 50%, #08111f 100%);
    }

    .page { max-width: 1480px; margin: 12px auto 24px; padding: 0 10px; }

    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }

    .top {
      padding: 10px;
      margin-bottom: 10px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .symbol-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .pill {
      font-size: 11px;
      border: 1px solid var(--line);
      background: #14213a;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    input, button, a.link-btn {
      background: #13213b;
      border: 1px solid #27406a;
      color: var(--text);
      border-radius: 8px;
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    input { width: 110px; font-weight: 700; letter-spacing: 0.4px; }

    button {
      background: linear-gradient(180deg, #1b3f6d 0%, #163356 100%);
      border-color: #3466a3;
      cursor: pointer;
      font-weight: 700;
    }

    .status {
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .status.ok { background: #0f2e22; border-color: #1b6e4a; color: #7af0b7; }
    .status.warn { background: #3a1f1f; border-color: #7d3535; color: #ffc4c4; }

    .meta { margin-top: 6px; color: var(--muted); font-size: 11px; }

    .kpis {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(10, minmax(120px, 1fr));
      gap: 6px;
    }

    .kpi {
      border: 1px solid #284165;
      border-radius: 8px;
      background: #0e1829;
      padding: 7px;
    }

    .kpi .label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .kpi .val { margin-top: 2px; font-size: 16px; font-weight: 800; }

    .board { padding: 10px; }

    .table-wrap {
      border: 1px solid #274067;
      border-radius: 10px;
      overflow: auto;
      max-height: 68vh;
      background: #0b1322;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 1450px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid #33568b;
      padding: 7px 5px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-align: right;
      white-space: nowrap;
      background: #142340;
    }

    thead th.call { background: #118243; color: #08180f; }
    thead th.put { background: #d0787d; color: #1d090b; }
    thead th.sp { text-align: center; background: #1a2f51; color: var(--gold); }

    tbody td {
      border-bottom: 1px solid #172845;
      padding: 5px 5px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tbody tr:nth-child(odd) { background: #0a1220; }
    tbody tr:nth-child(even) { background: #0c1628; }
    tbody tr:hover { background: #142542; }

    .call-col { background: linear-gradient(90deg, rgba(18,104,54,0.36), transparent); }
    .put-col { background: linear-gradient(270deg, rgba(154,58,68,0.28), transparent); }

    .sp-cell {
      text-align: center;
      color: #ffe08a;
      font-weight: 800;
      background: #131f35;
    }

    .atm { outline: 1px solid #f7d34a; outline-offset: -1px; }

    .pos { color: var(--good); font-weight: 700; }
    .neg { color: var(--bad); font-weight: 700; }

    tfoot td {
      position: sticky;
      bottom: 0;
      z-index: 1;
      background: #101a2e;
      border-top: 1px solid #33568b;
      padding: 7px 5px;
      font-weight: 800;
      text-align: right;
    }

    .summary-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 120px 220px 120px 220px;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .sum-label {
      background: #e6e6e6;
      color: #111;
      border-radius: 6px;
      font-weight: 800;
      text-align: center;
      padding: 8px 6px;
    }

    .sum-val {
      border-radius: 6px;
      font-weight: 900;
      text-align: center;
      padding: 8px 6px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 1px;
    }

    .sum-val.coi { background: #f1e500; color: #121212; }
    .sum-val.oi { background: #d9d9d9; color: #111; }

    @media (max-width: 1200px) {
      .kpis { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .summary-row { grid-template-columns: 120px 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card top">
      <div class="top-row">
        <div class="symbol-title">
          <span id="symbolBadge">NIFTY</span>
          <span class="pill">LATEST SNAPSHOT</span>
        </div>
        <div class="actions">
          <label>Symbol <input id="symbol" value="NIFTY" /></label>
          <button id="refreshBtn">Refresh</button>
          <a class="link-btn" href="/login">FYERS Login</a>
        </div>
      </div>

      <div id="fyersStatus" class="status warn">Checking FYERS login status...</div>
      <div id="dataStatus" class="status warn" style="display:none;"></div>
      <div id="meta" class="meta">Market date: -</div>

      <div class="kpis" id="kpis"></div>
    </div>

    <div class="card board">
      <div class="table-wrap">
        <table id="gridTable">
          <thead>
            <tr>
              <th class="call">RATIO</th>
              <th class="call">COI % CHNG</th>
              <th class="call">OI</th>
              <th class="call">COI</th>
              <th class="call">PRICE CHG</th>
              <th class="call">LTP</th>
              <th class="call">VWAP</th>
              <th class="sp">STRIKE</th>
              <th class="put">VWAP</th>
              <th class="put">LTP</th>
              <th class="put">PRICE CHG</th>
              <th class="put">COI</th>
              <th class="put">OI</th>
              <th class="put">COI % CHNG</th>
              <th class="put">RATIO</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td></td>
              <td></td>
              <td id="footCallOi"></td>
              <td id="footCallCoi"></td>
              <td></td>
              <td></td>
              <td></td>
              <td id="footOiPcr" class="sp-cell"></td>
              <td></td>
              <td></td>
              <td></td>
              <td id="footPutCoi"></td>
              <td id="footPutOi"></td>
              <td></td>
              <td id="footCoiPcr"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="summary-row">
        <div class="sum-label">COI</div>
        <div class="sum-val coi" id="coiDiff">-</div>
        <div class="sum-label">OI</div>
        <div class="sum-val oi" id="oiDiff">-</div>
      </div>
    </div>
  </div>

  <script>
    let timerId = null;
    let refreshMs = 5 * 60 * 1000;

    function fmt(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      const n = Number(v);
      return n < 0 ? `(${Math.abs(n).toLocaleString()})` : n.toLocaleString();
    }

    function fmt2(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      const n = Number(v);
      const fixed = Math.abs(n).toFixed(2);
      return n < 0 ? `(${fixed})` : fixed;
    }

    function signedClass(v) {
      if (v === null || v === undefined || Number(v) === 0) return "";
      return Number(v) > 0 ? "pos" : "neg";
    }

    function safeDivPct(num, den) {
      if (num === null || den === null || den === 0 || den === undefined) return null;
      return (Number(num) / Number(den)) * 100;
    }

    function toIST(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleTimeString("en-IN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Kolkata"
      });
    }

    async function refreshFyersStatus() {
      const statusEl = document.getElementById("fyersStatus");
      try {
        const statusRes = await fetch("/api/v1/fyers/status", { credentials: "include" });
        const statusBody = await statusRes.json();
        const token = statusBody.data || {};
        if (statusRes.ok && token.has_token) {
          statusEl.className = "status ok";
          statusEl.textContent = `FYERS logged in for ${token.token_date}`;
          return;
        }
        statusEl.className = "status warn";
        statusEl.innerHTML = `FYERS token missing for today. Login from <a href="/login" style="color:#ffdf9a">/login</a>.`;
      } catch (e) {
        statusEl.className = "status warn";
        statusEl.textContent = "Unable to fetch FYERS status.";
      }
    }

    function showDataStatus(message) {
      const el = document.getElementById("dataStatus");
      el.style.display = "block";
      el.className = "status warn";
      el.textContent = message;
    }

    async function load() {
      const symbol = (document.getElementById("symbol").value || "").trim().toUpperCase();
      document.getElementById("symbolBadge").textContent = symbol || "NIFTY";
      await refreshFyersStatus();

      let res;
      let body;
      try {
        res = await fetch(`/api/v1/dashboard/data?symbol=${encodeURIComponent(symbol)}&timeline_limit=1`, { credentials: "include" });
        body = await res.json();
      } catch (e) {
        showDataStatus("Dashboard data request failed. Check API logs.");
        return;
      }

      if (!res.ok || !body.success) {
        showDataStatus(`Dashboard API failed with HTTP ${res.status}`);
        return;
      }
      document.getElementById("dataStatus").style.display = "none";

      const data = body.data || {};
      const latest = data.latest;
      const strikes = data.strikes || [];
      refreshMs = (data.refresh_seconds || 300) * 1000;

      document.getElementById("meta").textContent =
        `Market date: ${data.market_date || "-"} | Captured (IST): ${latest ? toIST(latest.captured_at) : "-"} | Auto-refresh: ${refreshMs / 60000}m`;

      const kpis = [
        ["SPOT", latest ? fmt2(latest.spot_price) : "-"],
        ["OI PCR", latest ? fmt2(latest.pcr_oi) : "-"],
        ["COI PCR", latest ? fmt2(latest.pcr_oi_change) : "-"],
        ["CALL OI %", latest ? `${fmt2(latest.call_oi_share_pct)}%` : "-"],
        ["PUT OI %", latest ? `${fmt2(latest.put_oi_share_pct)}%` : "-"],
        ["CALL COI %", latest ? `${fmt2(latest.call_oi_change_share_pct)}%` : "-"],
        ["PUT COI %", latest ? `${fmt2(latest.put_oi_change_share_pct)}%` : "-"],
        ["NET OI", latest ? fmt(latest.net_oi_sum) : "-"],
        ["NET COI", latest ? fmt(latest.net_oi_change_sum) : "-"],
        ["SYMBOL", data.instrument ? data.instrument.symbol : "-"]
      ];
      document.getElementById("kpis").innerHTML = kpis
        .map(([label, val]) => `<div class="kpi"><div class="label">${label}</div><div class="val">${val}</div></div>`)
        .join("");

      const spot = latest ? Number(latest.spot_price) : null;
      let atmStrike = null;
      if (spot !== null && strikes.length > 0) {
        atmStrike = strikes.reduce((acc, row) => {
          const sp = Number(row.strike_price);
          if (acc === null) return sp;
          return Math.abs(sp - spot) < Math.abs(acc - spot) ? sp : acc;
        }, null);
      }

      const tbody = document.querySelector("#gridTable tbody");
      tbody.innerHTML = strikes.map((row) => {
        const callCoi = row.call_oi_change ?? 0;
        const putCoi = row.put_oi_change ?? 0;
        const callOi = row.call_oi ?? 0;
        const putOi = row.put_oi ?? 0;

        const totalCoi = Number(callCoi) + Number(putCoi);
        const callRatio = safeDivPct(callCoi, totalCoi);
        const putRatio = safeDivPct(putCoi, totalCoi);

        const callCoiPctChng = safeDivPct(callCoi, Number(callOi) - Number(callCoi));
        const putCoiPctChng = safeDivPct(putCoi, Number(putOi) - Number(putCoi));

        const isAtm = atmStrike !== null && Number(row.strike_price) === Number(atmStrike);

        return `
          <tr>
            <td class="call-col">${fmt2(callRatio)}</td>
            <td class="call-col ${signedClass(callCoiPctChng)}">${fmt2(callCoiPctChng)}</td>
            <td class="call-col">${fmt(callOi)}</td>
            <td class="call-col ${signedClass(callCoi)}">${fmt(callCoi)}</td>
            <td class="call-col ${signedClass(row.call_ltp_change)}">${fmt2(row.call_ltp_change)}</td>
            <td class="call-col ${signedClass(row.call_ltp_change)}">${fmt2(row.call_ltp)}</td>
            <td class="call-col">-</td>
            <td class="sp-cell ${isAtm ? 'atm' : ''}">${fmt2(row.strike_price)}</td>
            <td class="put-col">-</td>
            <td class="put-col ${signedClass(row.put_ltp_change)}">${fmt2(row.put_ltp)}</td>
            <td class="put-col ${signedClass(row.put_ltp_change)}">${fmt2(row.put_ltp_change)}</td>
            <td class="put-col ${signedClass(putCoi)}">${fmt(putCoi)}</td>
            <td class="put-col">${fmt(putOi)}</td>
            <td class="put-col ${signedClass(putCoiPctChng)}">${fmt2(putCoiPctChng)}</td>
            <td class="put-col">${fmt2(putRatio)}</td>
          </tr>
        `;
      }).join("");

      const callOiSum = latest ? latest.call_oi_sum : null;
      const putOiSum = latest ? latest.put_oi_sum : null;
      const callCoiSum = latest ? latest.call_oi_change_sum : null;
      const putCoiSum = latest ? latest.put_oi_change_sum : null;

      document.getElementById("footCallOi").textContent = fmt(callOiSum);
      document.getElementById("footPutOi").textContent = fmt(putOiSum);
      document.getElementById("footCallCoi").textContent = fmt(callCoiSum);
      document.getElementById("footPutCoi").textContent = fmt(putCoiSum);
      document.getElementById("footOiPcr").textContent = latest ? `OI PCR ${fmt2(latest.pcr_oi)}` : "-";
      document.getElementById("footCoiPcr").textContent = latest ? `COI PCR ${fmt2(latest.pcr_oi_change)}` : "-";

      const coiDiff = latest ? Number(putCoiSum || 0) - Number(callCoiSum || 0) : null;
      const oiDiff = latest ? Number(putOiSum || 0) - Number(callOiSum || 0) : null;
      document.getElementById("coiDiff").textContent = fmt(coiDiff);
      document.getElementById("oiDiff").textContent = fmt(oiDiff);

      if (timerId) clearTimeout(timerId);
      timerId = setTimeout(load, refreshMs);
    }

    document.getElementById("refreshBtn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
