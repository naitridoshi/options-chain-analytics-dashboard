<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chart - Options Chain Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
  <style>
    :root {
      --bg: #000000;
      --panel: #000000;
      --panel-2: #0a0a0a;
      --line: #1e3a5f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: #000000; }
    body { font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif; background: #000000; min-height: 100vh; color: var(--text); }
    .page { max-width: 1400px; margin: 8px auto; padding: 0 8px; }
    .card { background: #000000; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

    .navbar { display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: #0a0a0a; border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; flex-wrap: wrap; }
    .nav-spot-wrap { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .nav-spot-item { display: inline-flex; align-items: center; gap: 3px; }
    .nav-label { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.3px; }
    .nav-val { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
    .nav-val.pos { color: var(--good); }
    .nav-val.neg { color: var(--bad); }
    .nav-sep { width: 1px; height: 16px; background: var(--line); }

    .streaming-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }
    .streaming-toggle span { font-size: 10px; font-weight: 600; color: var(--muted); }
    .toggle-switch { width: 34px; height: 18px; border-radius: 9px; background: #1e293b; cursor: pointer; position: relative; transition: background 0.2s; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #475569; transition: all 0.2s; }
    .toggle-switch.active { background: rgba(56,189,248,0.3); }
    .toggle-switch.active::after { left: 18px; background: var(--accent); }

    .content { padding: 16px; }

    /* Controls */
    .controls-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .control-group { display: flex; align-items: center; gap: 6px; }
    .control-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .control-select {
      background: #0a0f1a; border: 1px solid var(--line); color: var(--text); border-radius: 4px;
      padding: 6px 10px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; min-width: 100px;
    }
    .control-select:focus { outline: none; border-color: var(--accent); }
    .control-sep { width: 1px; height: 24px; background: var(--line); }
    .ltp-badge { display: inline-flex; align-items: center; gap: 4px; background: #0a0f1a; border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ltp-badge .ltp-label { font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .ltp-badge .ltp-val { font-size: 12px; }
    .ltp-badge.call .ltp-val { color: var(--good); }
    .ltp-badge.put .ltp-val { color: var(--bad); }
    .reset-zoom-btn { background: #1e293b; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; display: none; }
    .reset-zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
    .chart-meta { font-size: 10px; color: var(--muted); margin-left: auto; }

    /* Chart container */
    .chart-wrapper {
      position: relative; background: #0a0f1a; border: 1px solid var(--line); border-radius: 6px;
      padding: 16px; height: calc(100vh - 200px); min-height: 400px;
    }
    .chart-wrapper canvas { width: 100% !important; height: 100% !important; }

    /* Loading */
    .loading { display: flex; justify-content: center; align-items: center; height: 300px; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .controls-bar { gap: 8px; }
      .chart-wrapper { height: calc(100vh - 260px); min-height: 300px; }
    }

    /* Divergence Tables */
    .divergence-section {
      margin-top: 18px;
    }
    .divergence-section-title {
      font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.6px; margin-bottom: 10px; padding-left: 2px;
    }
    .divergence-tables-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 700px) {
      .divergence-tables-row { grid-template-columns: 1fr; }
    }
    .div-table-wrap {
      background: #0a0f1a;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .div-table-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: #0d1521;
      border-bottom: 1px solid var(--line);
    }
    .div-table-title {
      font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .div-table-subtitle {
      font-size: 9px; color: var(--muted); font-weight: 600;
    }
    .div-table {
      width: 100%; border-collapse: collapse;
    }
    .div-table th {
      background: #0a1628;
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px;
      padding: 7px 10px; text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .div-table td {
      padding: 6px 10px; font-size: 11px; font-weight: 600;
      text-align: center; border-bottom: 1px solid rgba(30,58,95,0.25);
      font-variant-numeric: tabular-nums; color: var(--text);
    }
    .div-table tr:last-child td { border-bottom: none; }
    .div-table tr:hover td { background: rgba(56,189,248,0.03); }
    .div-table td.time-col { color: var(--muted); font-size: 10px; }
    .div-table td.spot-col { color: #38bdf8; }
    .div-table td.call-col { color: #22c55e; }
    .div-table td.put-col  { color: #ef4444; }
    /* Alert cells */
    .div-alert-call {
      background: rgba(34,197,94,0.12) !important;
      color: #22c55e !important;
      font-weight: 800;
      border-radius: 3px;
    }
    .div-alert-put {
      background: rgba(239,68,68,0.12) !important;
      color: #ef4444 !important;
      font-weight: 800;
      border-radius: 3px;
    }
    .div-action-call { color: #22c55e; font-weight: 800; }
    .div-action-put  { color: #ef4444; font-weight: 800; }
    .div-no-data { text-align:center; padding: 20px; color: var(--muted); font-size: 11px; }
    /* Strike info bar */
    .div-strike-bar {
      display: flex; align-items: center; gap: 0; justify-content: center;
      padding: 6px 12px;
      background: #060d18;
      border-bottom: 1px solid var(--line);
      font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    }
    .div-strike-item {
      display: inline-flex; align-items: center; gap: 5px;
    }
    .div-strike-label { color: var(--muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .div-strike-val   { font-variant-numeric: tabular-nums; }
    .div-strike-val.call { color: #22c55e; }
    .div-strike-val.put  { color: #ef4444; }
    .div-strike-sep   { width: 1px; height: 14px; background: var(--line); margin: 0 12px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="navbar">
        <div id="navLinks" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"></div>
        <div class="nav-spot-wrap">
          <div class="nav-spot-item"><span class="nav-label">Spot</span><span id="navSpot" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="nav-spot-item"><span class="nav-label">Chg</span><span id="navChange" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="nav-spot-item"><span class="nav-label">Chg%</span><span id="navChangePct" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="streaming-toggle">
            <span>Streaming</span>
            <div class="toggle-switch" id="streamingToggle"></div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="controls-bar">
          <div class="control-group">
            <span class="control-label">Call Strike</span>
            <select class="control-select" id="callStrikeSelect"><option value="">Loading...</option></select>
          </div>
          <div class="control-sep"></div>
          <div class="control-group">
            <span class="control-label">Put Strike</span>
            <select class="control-select" id="putStrikeSelect"><option value="">Loading...</option></select>
          </div>
          <div class="control-sep"></div>
          <div class="ltp-badge call"><span class="ltp-label">Call LTP</span><span class="ltp-val" id="callLtpVal">-</span></div>
          <div class="ltp-badge put"><span class="ltp-label">Put LTP</span><span class="ltp-val" id="putLtpVal">-</span></div>
          <div class="control-sep"></div>
          <button class="reset-zoom-btn" id="resetZoomBtn" onclick="resetZoom()">Reset Zoom</button>
          <span class="chart-meta" id="chartMeta">-</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="mainChart"></canvas>
        </div>

        <!-- Divergence Tables -->
        <div class="divergence-section">
          <div class="divergence-section-title">LTP Divergence Monitor &mdash; Last 10 Minutes</div>
          <div class="divergence-tables-row">
            <!-- 1-min table -->
            <div class="div-table-wrap">
              <div class="div-table-header">
                <span class="div-table-title">1-Min Interval</span>
                <span class="div-table-subtitle" id="divMeta1">--</span>
              </div>
              <div class="div-strike-bar" id="divStrike1">
                <div class="div-strike-item">
                  <span class="div-strike-label">Call Strike</span>
                  <span class="div-strike-val call" id="divCallStrike1">--</span>
                </div>
                <div class="div-strike-sep"></div>
                <div class="div-strike-item">
                  <span class="div-strike-label">Put Strike</span>
                  <span class="div-strike-val put" id="divPutStrike1">--</span>
                </div>
              </div>
              <table class="div-table">
                <thead><tr>
                  <th>TIME</th><th>SPOT</th><th>CALL LTP</th><th>PUT LTP</th><th>ALERT</th><th>ACTION</th>
                </tr></thead>
                <tbody id="divBody1"><tr><td colspan="6" class="div-no-data">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
            <!-- 1-min @ :30s table -->
            <div class="div-table-wrap">
              <div class="div-table-header">
                <span class="div-table-title">1-Min &nbsp;<span style="font-size:9px;color:var(--muted);font-weight:600">@ :30s</span></span>
                <span class="div-table-subtitle" id="divMeta2">--</span>
              </div>
              <div class="div-strike-bar" id="divStrike2">
                <div class="div-strike-item">
                  <span class="div-strike-label">Call Strike</span>
                  <span class="div-strike-val call" id="divCallStrike2">--</span>
                </div>
                <div class="div-strike-sep"></div>
                <div class="div-strike-item">
                  <span class="div-strike-label">Put Strike</span>
                  <span class="div-strike-val put" id="divPutStrike2">--</span>
                </div>
              </div>
              <table class="div-table">
                <thead><tr>
                  <th>TIME</th><th>SPOT</th><th>CALL LTP</th><th>PUT LTP</th><th>ALERT</th><th>ACTION</th>
                </tr></thead>
                <tbody id="divBody2"><tr><td colspan="6" class="div-no-data">Loading&hellip;</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Navbar
  (function renderNavbar() {
    const pages = [{href:"/scoring",label:"Scoring"},{href:"/dashboard",label:"Dashboard"},{href:"/coi-live",label:"COI Live"},{href:"/heatmap",label:"Heatmap"},{href:"/coi-pcr-live",label:"Ratio"},{href:"/market-breadth",label:"A2D"},{href:"/most-active",label:"Most Active"},{href:"/chart",label:"Chart"}];
    const nav = document.getElementById("navLinks");
    const css = "display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;height:28px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s ease;white-space:nowrap;";
    const activeCss = "background:rgba(56,189,248,0.1);color:var(--accent);border-color:rgba(56,189,248,0.3);";
    const sep = "<div style='width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0;'></div>";
    nav.innerHTML = pages.map(p => {
      const isActive = window.location.pathname === p.href;
      return `<a href="${p.href}" style="${css}${isActive ? activeCss : ''}">${p.label}</a>`;
    }).join(sep);
  })();

  let chart = null;
  let isStreaming = false;
  let refreshInterval = null;

  // Streaming toggle
  document.getElementById("streamingToggle").addEventListener("click", function() {
    isStreaming = !isStreaming;
    this.classList.toggle("active", isStreaming);
    if (isStreaming) startStreaming(); else stopStreaming();
  });

  function startStreaming() { if (!refreshInterval) refreshInterval = setInterval(loadChartData, 15000); }
  function stopStreaming() { if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; } }

  // Load strike prices from dashboard data
  async function loadStrikes() {
    try {
      const res = await fetch("/api/v1/dashboard/data?symbol=NIFTY", { credentials: "include" });
      const result = await res.json();
      if (result.success && result.data && result.data.strikes) {
        const strikes = result.data.strikes;
        const prices = [...new Set(strikes.map(s => s.strike_price))].sort((a, b) => a - b);
        populateStrikeDropdown("callStrikeSelect", prices);
        populateStrikeDropdown("putStrikeSelect", prices);
        // Default to ATM (middle)
        const atmIdx = Math.floor(prices.length / 2);
        document.getElementById("callStrikeSelect").value = prices[atmIdx];
        document.getElementById("putStrikeSelect").value = prices[atmIdx];
        return prices;
      }
    } catch (e) { console.error("Failed to load strikes:", e); }
    return [];
  }

  function populateStrikeDropdown(id, prices) {
    const sel = document.getElementById(id);
    sel.innerHTML = prices.map(p => `<option value="${p}">${p}</option>`).join("");
  }

  // Load chart data
  async function loadChartData() {
    const callStrike = document.getElementById("callStrikeSelect").value;
    const putStrike = document.getElementById("putStrikeSelect").value;
    if (!callStrike && !putStrike) return;

    try {
      const params = new URLSearchParams();
      if (callStrike) params.set("call_strike", callStrike);
      if (putStrike) params.set("put_strike", putStrike);
      const res = await fetch(`/api/v1/dashboard/chart-data?${params}`, { credentials: "include" });
      const result = await res.json();
      if (result.success && result.data) {
        renderChart(result.data);
        renderDivergenceTables(result.data);
        const meta = document.getElementById("chartMeta");
        const pts = result.data.timestamps.length;
        meta.textContent = `${pts} data points | Updated: ${new Date().toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour12: false })} IST`;
      }
    } catch (e) { console.error("Chart data fetch failed:", e); }
  }

  function renderChart(data) {
    const ctx = document.getElementById("mainChart").getContext("2d");
    const labels = data.timestamps || [];
    const spotData = data.spot || [];
    const callData = data.call_ltp || [];
    const putData = data.put_ltp || [];

    // Update LTP indicators with latest non-null values
    const lastCall = [...callData].reverse().find(v => v != null);
    const lastPut = [...putData].reverse().find(v => v != null);
    document.getElementById("callLtpVal").textContent = lastCall != null ? Number(lastCall).toFixed(2) : "-";
    document.getElementById("putLtpVal").textContent = lastPut != null ? Number(lastPut).toFixed(2) : "-";

    const datasets = [
      {
        label: `Spot`,
        data: spotData,
        borderColor: "#38bdf8",
        backgroundColor: "rgba(56,189,248,0.1)",
        borderWidth: 2,
        pointRadius: 0,
        pointHitRadius: 6,
        tension: 0.2,
        yAxisID: "y",
        fill: false,
      },
      {
        label: `Call LTP (${data.call_strike})`,
        data: callData,
        borderColor: "#22c55e",
        backgroundColor: "rgba(34,197,94,0.1)",
        borderWidth: 2,
        pointRadius: 0,
        pointHitRadius: 6,
        tension: 0.2,
        yAxisID: "y1",
        fill: false,
      },
      {
        label: `Put LTP (${data.put_strike})`,
        data: putData,
        borderColor: "#ef4444",
        backgroundColor: "rgba(239,68,68,0.1)",
        borderWidth: 2,
        pointRadius: 0,
        pointHitRadius: 6,
        tension: 0.2,
        yAxisID: "y1",
        fill: false,
      },
    ];

    // VWAP annotation lines
    const annotations = {};
    if (data.call_vwap != null) {
      annotations.callVwap = {
        type: "line",
        yScaleID: "y1",
        yMin: data.call_vwap,
        yMax: data.call_vwap,
        borderColor: "rgba(34,197,94,0.5)",
        borderWidth: 1.5,
        borderDash: [6, 4],
        label: {
          display: true,
          content: `Call VWAP: ${Number(data.call_vwap).toFixed(2)}`,
          position: "start",
          backgroundColor: "rgba(34,197,94,0.8)",
          color: "#fff",
          font: { size: 10, weight: "bold" },
          padding: 3,
        },
      };
    }
    if (data.put_vwap != null) {
      annotations.putVwap = {
        type: "line",
        yScaleID: "y1",
        yMin: data.put_vwap,
        yMax: data.put_vwap,
        borderColor: "rgba(239,68,68,0.5)",
        borderWidth: 1.5,
        borderDash: [6, 4],
        label: {
          display: true,
          content: `Put VWAP: ${Number(data.put_vwap).toFixed(2)}`,
          position: "end",
          backgroundColor: "rgba(239,68,68,0.8)",
          color: "#fff",
          font: { size: 10, weight: "bold" },
          padding: 3,
        },
      };
    }

    const config = {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            position: "top",
            labels: {
              color: "#94a3b8",
              font: { size: 11, weight: 600 },
              usePointStyle: true,
              pointStyle: "line",
              padding: 16,
            },
          },
          tooltip: {
            backgroundColor: "rgba(0,0,0,0.9)",
            titleColor: "#f8fafc",
            bodyColor: "#94a3b8",
            borderColor: "#1e3a5f",
            borderWidth: 1,
            padding: 10,
            titleFont: { size: 11, weight: 700 },
            bodyFont: { size: 11 },
            callbacks: {
              label: function(ctx) {
                const v = ctx.parsed.y;
                return `${ctx.dataset.label}: ${v != null ? Number(v).toFixed(2) : "-"}`;
              },
            },
          },
          annotation: { annotations },
          zoom: {
            zoom: {
              wheel: { enabled: true },
              pinch: { enabled: true },
              mode: "x",
              onZoom: function() { document.getElementById("resetZoomBtn").style.display = "inline-block"; },
            },
            pan: {
              enabled: true,
              mode: "x",
            },
          },
        },
        scales: {
          x: {
            grid: { color: "rgba(30,58,95,0.3)" },
            ticks: {
              color: "#94a3b8",
              font: { size: 10 },
              maxTicksLimit: 20,
              maxRotation: 0,
            },
          },
          y: {
            type: "linear",
            position: "right",
            title: { display: true, text: "Spot Price", color: "#38bdf8", font: { size: 10, weight: 700 } },
            grid: { color: "rgba(30,58,95,0.3)" },
            ticks: { color: "#38bdf8", font: { size: 10 } },
          },
          y1: {
            type: "linear",
            position: "right",
            title: { display: true, text: "LTP / VWAP", color: "#94a3b8", font: { size: 10, weight: 700 } },
            grid: { drawOnChartArea: false },
            ticks: { color: "#94a3b8", font: { size: 10 } },
          },
        },
      },
    };

    if (chart) {
      chart.data.labels = config.data.labels;
      chart.data.datasets.forEach((ds, i) => { ds.data = config.data.datasets[i].data; });
      chart.update("none");
    } else {
      chart = new Chart(ctx, config);
    }
  }

  // Strike change handlers
  document.getElementById("callStrikeSelect").addEventListener("change", loadChartData);
  document.getElementById("putStrikeSelect").addEventListener("change", loadChartData);

  // Zoom
  function resetZoom() {
    if (chart) chart.resetZoom();
    document.getElementById("resetZoomBtn").style.display = "none";
  }

  // Spot data fetcher
  async function loadSpotData() {
    try {
      const res = await fetch("/api/v1/spot-data", { credentials: "include" });
      const result = await res.json();
      if (result.success && result.data) {
        const d = result.data;
        const spot = d.spot_price;
        if (spot != null) document.getElementById("navSpot").textContent = Number(spot).toLocaleString("en-IN", { maximumFractionDigits: 2 });
        if (d.change_from_prev_close != null) {
          const v = Number(d.change_from_prev_close);
          const el = document.getElementById("navChange");
          el.textContent = (v >= 0 ? "+" : "") + v.toFixed(2);
          el.className = "nav-val " + (v >= 0 ? "pos" : "neg");
        }
        if (d.change_pct_from_prev_close != null) {
          const v = Number(d.change_pct_from_prev_close);
          const el = document.getElementById("navChangePct");
          el.textContent = (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
          el.className = "nav-val " + (v >= 0 ? "pos" : "neg");
        }
      }
    } catch (e) { console.error("Spot data fetch failed:", e); }
  }

  // Initial load
  loadStrikes().then(() => loadChartData());
  loadSpotData();
  setInterval(loadSpotData, 30000);

  // ── Divergence Tables ──────────────────────────────────────────

  // Holds the last fetched raw data for table rendering
  let _divRawData = null;

  // Sample series into 1 per clock-minute-bucket covering the last 10 minutes.
  // intervalMinutes: 1 (1-min table)
  // Picks the LAST point in each minute bucket.
  function _sampleSeries(data, intervalMinutes) {
    const ts   = data.timestamps || [];
    const spot = data.spot       || [];
    const call = data.call_ltp   || [];
    const put  = data.put_ltp    || [];
    if (!ts.length) return [];

    // bucketKey = floor(totalMinutes / intervalMinutes) — same bucket = same row
    const bucketMap = new Map();
    for (let i = 0; i < ts.length; i++) {
      const parts = (ts[i] || '').split(':');
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      if (isNaN(h) || isNaN(m)) continue;
      const totalMin  = h * 60 + m;
      const bucketKey = Math.floor(totalMin / intervalMinutes);
      // Always overwrite so the LAST (most recent) point in the bucket wins
      bucketMap.set(bucketKey, { time: ts[i], spot: spot[i], call: call[i], put: put[i] });
    }

    const rowCount = Math.round(10 / intervalMinutes); // 10 rows for 1-min
    const sorted = Array.from(bucketMap.entries())
      .sort((a, b) => a[0] - b[0])
      .map(([, p]) => p);

    return sorted.slice(-rowCount);
  }

  // Variant: for each 1-minute bucket pick the point whose seconds value is
  // closest to targetSec (default 30). Gives rows like 10:01:30, 10:02:30.
  function _sampleSeriesAt30s(data, targetSec) {
    const ts   = data.timestamps || [];
    const spot = data.spot       || [];
    const call = data.call_ltp   || [];
    const put  = data.put_ltp    || [];
    if (!ts.length) return [];

    targetSec = targetSec !== undefined ? targetSec : 30;

    // Build per-minute-bucket map; keep the candidate closest to targetSec
    // bucketKey = HH * 60 + MM (one bucket per clock minute)
    const bucketMap = new Map();
    for (let i = 0; i < ts.length; i++) {
      const parts = (ts[i] || '').split(':');
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const s = parseInt(parts[2] || '0', 10);
      if (isNaN(h) || isNaN(m)) continue;
      const bucketKey = h * 60 + m;
      const dist = Math.abs(s - targetSec);
      const existing = bucketMap.get(bucketKey);
      if (!existing || dist < existing.dist) {
        bucketMap.set(bucketKey, { dist, time: ts[i], spot: spot[i], call: call[i], put: put[i] });
      }
    }

    // Sort chronologically, strip the helper `dist` field, keep last 10 rows
    const sorted = Array.from(bucketMap.entries())
      .sort((a, b) => a[0] - b[0])
      .map(([, p]) => ({ time: p.time, spot: p.spot, call: p.call, put: p.put }));

    return sorted.slice(-10);
  }

  function _buildDivRows(rows) {
    if (!rows.length) return '<tr><td colspan="6" class="div-no-data">No data</td></tr>';
    return rows.map((row, i) => {
      const prev = i > 0 ? rows[i - 1] : null;

      const spotVal = row.spot != null ? Number(row.spot) : null;
      const callVal = row.call != null ? Number(row.call) : null;
      const putVal  = row.put  != null ? Number(row.put)  : null;

      let alertCls = '', alertTxt = '', actionCls = '', actionTxt = '';

      if (prev && spotVal != null && callVal != null && putVal != null) {
        const prevSpot = prev.spot != null ? Number(prev.spot) : null;
        const prevCall = prev.call != null ? Number(prev.call) : null;
        const prevPut  = prev.put  != null ? Number(prev.put)  : null;

        if (prevSpot != null && prevCall != null && prevPut != null) {
          const spotUp   = spotVal > prevSpot;
          const spotDown = spotVal < prevSpot;
          const callUp   = callVal > prevCall;
          const putUp    = putVal  > prevPut;

          // SPOT DOWN → ideally CALL LTP should go down; if it goes UP → CALL DIVERGENCE
          if (spotDown && callUp) {
            alertCls  = 'div-alert-call'; alertTxt  = 'CALL DIVERGENCE';
            actionCls = 'div-action-call'; actionTxt = 'BUY CALL';
          }
          // SPOT UP → ideally PUT LTP should go down; if it goes UP → PUT DIVERGENCE
          else if (spotUp && putUp) {
            alertCls  = 'div-alert-put'; alertTxt  = 'PUT DIVERGENCE';
            actionCls = 'div-action-put'; actionTxt = 'BUY PUT';
          }
        }
      }

      const fmtSpot = spotVal != null ? spotVal.toLocaleString('en-IN', { maximumFractionDigits: 0 }) : '-';
      const fmtCall = callVal != null ? callVal.toFixed(2) : '-';
      const fmtPut  = putVal  != null ? putVal.toFixed(2)  : '-';

      return `<tr>
        <td class="time-col">${row.time || '-'}</td>
        <td class="spot-col">${fmtSpot}</td>
        <td class="call-col">${fmtCall}</td>
        <td class="put-col">${fmtPut}</td>
        <td class="${alertCls}">${alertTxt}</td>
        <td class="${actionCls}">${actionTxt}</td>
      </tr>`;
    }).join('');
  }

  function renderDivergenceTables(data) {
    _divRawData = data;

    const rows1 = _sampleSeries(data, 1);      // 1-min buckets, last point per minute
    const rows2 = _sampleSeriesAt30s(data, 30); // 1-min buckets, point closest to :30s

    const tbody1 = document.getElementById('divBody1');
    const tbody2 = document.getElementById('divBody2');
    const meta1  = document.getElementById('divMeta1');
    const meta2  = document.getElementById('divMeta2');

    if (tbody1) tbody1.innerHTML = _buildDivRows(rows1);
    if (tbody2) tbody2.innerHTML = _buildDivRows(rows2);

    // Update strike info bars from API response
    const callStrike = data.call_strike != null ? data.call_strike : '--';
    const putStrike  = data.put_strike  != null ? data.put_strike  : '--';
    const _cs1 = document.getElementById('divCallStrike1');
    const _ps1 = document.getElementById('divPutStrike1');
    const _cs2 = document.getElementById('divCallStrike2');
    const _ps2 = document.getElementById('divPutStrike2');
    if (_cs1) _cs1.textContent = callStrike;
    if (_ps1) _ps1.textContent = putStrike;
    if (_cs2) _cs2.textContent = callStrike;
    if (_ps2) _ps2.textContent = putStrike;

    const updated = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
    if (meta1) meta1.textContent = `${rows1.length} rows | Updated ${updated} IST`;
    if (meta2) meta2.textContent = `${rows2.length} rows | Updated ${updated} IST`;
  }


  // Standalone divergence refresh (every 10 minutes)
  async function loadDivergenceData() {
    const callStrike = document.getElementById('callStrikeSelect').value;
    const putStrike  = document.getElementById('putStrikeSelect').value;
    if (!callStrike && !putStrike) return;
    try {
      const params = new URLSearchParams();
      if (callStrike) params.set('call_strike', callStrike);
      if (putStrike)  params.set('put_strike', putStrike);
      const res    = await fetch(`/api/v1/dashboard/chart-data?${params}`, { credentials: 'include' });
      const result = await res.json();
      if (result.success && result.data) renderDivergenceTables(result.data);
    } catch (e) { console.error('Divergence data fetch failed:', e); }
  }

  // Refresh divergence tables every 10 minutes independently
  setInterval(loadDivergenceData, 600000);
</script>
</body>
</html>
