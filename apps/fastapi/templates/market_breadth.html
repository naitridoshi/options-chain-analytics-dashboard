<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Breadth - Options Chain Analytics</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #000000;
      --panel-2: #000000;
      --line: #1e3a5f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background: #000000;
    }

    body {
      font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
      background: #000000;
      min-height: 100vh;
      color: var(--text);
    }

    .page { max-width: 1400px; margin: 8px auto; padding: 0 8px; }

    .card {
      background: #000000;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    /* Navbar spot values */
    .nav-spot-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .nav-spot-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .nav-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .nav-val {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .nav-val.pos { color: var(--good); }
    .nav-val.neg { color: var(--bad); }
    .nav-sep {
      width: 1px;
      height: 16px;
      background: var(--line);
    }

    /* Content */
    .content {
      padding: 16px;
    }

    /* Metrics Summary */
    .metrics-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px 16px;
      background: #000000;
      transition: all 0.2s ease;
    }

    .metric-card:hover {
      border-color: var(--accent);
    }

    .metric-icon {
      font-size: 18px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .metric-card.advance .metric-icon {
      background: rgba(34, 197, 94, 0.15);
      color: var(--good);
    }

    .metric-card.decline .metric-icon {
      background: rgba(239, 68, 68, 0.15);
      color: var(--bad);
    }

    .metric-card.unchanged .metric-icon {
      background: rgba(107, 114, 128, 0.15);
      color: #6b7280;
    }

    .metric-card.ratio .metric-icon {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 12px;
    }

    .metric-content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    .metric-card.advance .metric-value { color: var(--good); }
    .metric-card.decline .metric-value { color: var(--bad); }

    .metric-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* Progress Bar */
    .breadth-bar-section {
      margin-bottom: 16px;
    }

    .breadth-bar-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .breadth-bar {
      display: flex;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      background: #0a0a0a;
      border: 1px solid var(--line);
    }

    .breadth-bar-segment {
      transition: width 0.4s ease;
      min-width: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }

    .breadth-bar-segment.advance {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
    }

    .breadth-bar-segment.decline {
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
    }

    .breadth-bar-segment.unchanged {
      background: linear-gradient(180deg, #6b7280 0%, #4b5563 100%);
    }

    .breadth-bar-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .legend-advance { color: var(--good); }
    .legend-decline { color: var(--bad); }
    .legend-unchanged { color: #6b7280; }

    /* Sentiment */
    .sentiment-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: #0a0a0a;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .sentiment-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .sentiment-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .sentiment-badge.bullish {
      background: rgba(34, 197, 94, 0.15);
      color: var(--good);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .sentiment-badge.bearish {
      background: rgba(239, 68, 68, 0.15);
      color: var(--bad);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .sentiment-badge.neutral {
      background: rgba(107, 114, 128, 0.15);
      color: #9ca3af;
      border: 1px solid rgba(107, 114, 128, 0.4);
    }

    .captured-time {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0a0a0a;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 14px;
      flex: 1;
      max-width: 300px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-icon {
      color: var(--muted);
      font-size: 14px;
    }

    .filter-group {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      background: #0a0a0a;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .filter-btn:hover {
      background: #141414;
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .export-btn {
      background: linear-gradient(135deg, #166534 0%, #15803d 100%);
      border: 1px solid var(--good);
      color: #fff;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .export-btn:hover {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
    }

    /* Script List */
    .script-list-wrap {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #000000;
    }

    .script-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #0a0a0a;
      border-bottom: 1px solid var(--line);
    }

    .list-count {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .script-list {
      max-height: 500px;
      overflow: auto;
    }

    .script-list-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .script-list-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      font-weight: 700;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: color 0.2s ease;
      white-space: nowrap;
      font-size:13px;
    }

    .script-list-table thead th:hover {
      color: var(--panel);
    }

    .script-list-table tbody tr {
      border-bottom: 1px solid var(--line);
      transition: background 0.2s ease;
    }

    .script-list-table tbody tr:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    .script-list-table tbody tr:nth-child(odd) {
      background: #000000;
    }

    .script-list-table tbody tr:nth-child(even) {
      background: #050505;
    }

    .script-list-table tbody td {
      padding: 10px 12px;
      color: var(--text);
    }

    .pos { color: var(--good); font-weight: 700; }
    .neg { color: var(--bad); font-weight: 700; }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 14px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .metrics-summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .metrics-summary {
        grid-template-columns: 1fr;
      }
      .actions-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div id="navbar" style="display:flex;align-items:center;gap:6px;padding:10px 16px;background:#0a0a0a;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;">
        <div id="navLinks" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"></div>
        <div class="nav-spot-wrap">
          <div class="nav-spot-item"><span class="nav-label">Spot</span><span id="navSpot" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="nav-spot-item"><span class="nav-label">Chg</span><span id="navChange" class="nav-val">-</span></div>
          <div class="nav-sep"></div>
          <div class="nav-spot-item"><span class="nav-label">Chg%</span><span id="navChangePct" class="nav-val">-</span></div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Metrics Summary -->
        <div class="metrics-summary">
          <div class="metric-card advance">
            <div class="metric-icon">&#9650;</div>
            <div class="metric-content">
              <span class="metric-value" id="breadthAdvance">-</span>
              <span class="metric-label">Advancing</span>
            </div>
          </div>
          <div class="metric-card decline">
            <div class="metric-icon">&#9660;</div>
            <div class="metric-content">
              <span class="metric-value" id="breadthDecline">-</span>
              <span class="metric-label">Declining</span>
            </div>
          </div>
          <div class="metric-card unchanged">
            <div class="metric-icon">&#9679;</div>
            <div class="metric-content">
              <span class="metric-value" id="breadthUnchanged">-</span>
              <span class="metric-label">Unchanged</span>
            </div>
          </div>
          <div class="metric-card ratio">
            <div class="metric-icon">A/D</div>
            <div class="metric-content">
              <span class="metric-value" id="breadthRatio">-</span>
              <span class="metric-label">Ratio</span>
            </div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="breadth-bar-section">
          <div class="breadth-bar-label">Market Distribution</div>
          <div class="breadth-bar">
            <div id="breadthBarAdvance" class="breadth-bar-segment advance" style="width: 0%"></div>
            <div id="breadthBarUnchanged" class="breadth-bar-segment unchanged" style="width: 0%"></div>
            <div id="breadthBarDecline" class="breadth-bar-segment decline" style="width: 0%"></div>
          </div>
          <div class="breadth-bar-legend">
            <span class="legend-advance" id="breadthAdvancePct">0%</span>
            <span class="legend-unchanged" id="breadthUnchangedPct">0%</span>
            <span class="legend-decline" id="breadthDeclinePct">0%</span>
          </div>
        </div>

        <!-- Sentiment -->
        <div class="sentiment-section">
          <span class="sentiment-label">Market Sentiment:</span>
          <span id="breadthSentiment" class="sentiment-badge neutral">Neutral</span>
          <span id="capturedTime" class="captured-time">-</span>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar">
          <div class="search-box">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="searchInput" placeholder="Search by symbol or name..." />
          </div>
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="ADVANCE">Advance</button>
            <button class="filter-btn" data-filter="DECLINE">Decline</button>
            <button class="filter-btn" data-filter="UNCHANGED">Unchanged</button>
          </div>
          <button id="exportBtn" class="export-btn">
            <span>&#8615;</span>
            <span>Export CSV</span>
          </button>
        </div>

        <!-- Script List -->
        <div class="script-list-wrap">
          <div class="script-list-header">
            <span class="list-count" id="listCount">0 scripts</span>
          </div>
          <div class="script-list">
            <table class="script-list-table">
              <thead>
                <tr>
                  <th data-sort="symbol">Symbol</th>
                  <th data-sort="industry">Industry</th>
                  <th data-sort="ltp">LTP</th>
                  <th data-sort="previous_close">Prev Close</th>
                  <th data-sort="change">Change</th>
                  <th data-sort="change_pct">Change %</th>
                </tr>
              </thead>
              <tbody id="scriptListBody">
                <tr>
                  <td colspan="6">
                    <div class="loading">
                      <div class="spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){var pages=[{href:"/dashboard",label:"Dashboard"},{href:"/heatmap",label:"Heatmap"},{href:"/market-breadth",label:"A2D"},{href:"/most-active",label:"Most Active"},{href:"/coi-live",label:"COI Live"},{href:"/coi-pcr-live",label:"Ratio"},{href:"/scoring",label:"Scoring"}];var nav=document.getElementById("navLinks");if(!nav)return;var css="display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;height:28px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s ease;white-space:nowrap;";var sep="<div style='width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0;'></div>";nav.innerHTML=pages.map(function(p){return"<a href='"+p.href+"' style='"+css+(window.location.pathname===p.href?"background:rgba(56,189,248,0.1);color:var(--accent);border-color:rgba(56,189,248,0.3);":"")+"'>"+p.label+"</a>"}).join(sep)})();
    let allScripts = [];
    let currentFilter = "all";
    let currentSearch = "";
    let currentSort = { field: "symbol", dir: "asc" };

    function fmt(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return Number(v).toLocaleString();
    }

    function fmt2(v) {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return Number(v).toFixed(2);
    }

    function escHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function toIST(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleTimeString("en-IN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Kolkata"
      });
    }

    function updateMetrics(data) {
      const advance = Number(data.advance_count || 0);
      const decline = Number(data.decline_count || 0);
      const unchanged = Number(data.unchanged_count || 0);
      const total = advance + decline + unchanged;
      const ratio = decline === 0
        ? (advance === 0 ? "-" : "∞")
        : (advance / decline).toFixed(2);

      document.getElementById("breadthAdvance").textContent = fmt(advance);
      document.getElementById("breadthDecline").textContent = fmt(decline);
      document.getElementById("breadthUnchanged").textContent = fmt(unchanged);
      document.getElementById("breadthRatio").textContent = ratio;

      // Update progress bar
      if (total > 0) {
        const advancePct = (advance / total) * 100;
        const declinePct = (decline / total) * 100;
        const unchangedPct = (unchanged / total) * 100;

        document.getElementById("breadthBarAdvance").style.width = `${advancePct}%`;
        document.getElementById("breadthBarUnchanged").style.width = `${unchangedPct}%`;
        document.getElementById("breadthBarDecline").style.width = `${declinePct}%`;

        document.getElementById("breadthAdvancePct").textContent = `${advancePct.toFixed(1)}%`;
        document.getElementById("breadthUnchangedPct").textContent = `${unchangedPct.toFixed(1)}%`;
        document.getElementById("breadthDeclinePct").textContent = `${declinePct.toFixed(1)}%`;
      }

      // Update sentiment
      const sentimentEl = document.getElementById("breadthSentiment");
      const advancePct = total > 0 ? (advance / total) * 100 : 0;
      const declinePct = total > 0 ? (decline / total) * 100 : 0;

      if (advancePct > 60) {
        sentimentEl.textContent = "Bullish";
        sentimentEl.className = "sentiment-badge bullish";
      } else if (declinePct > 60) {
        sentimentEl.textContent = "Bearish";
        sentimentEl.className = "sentiment-badge bearish";
      } else {
        sentimentEl.textContent = "Neutral";
        sentimentEl.className = "sentiment-badge neutral";
      }

      document.getElementById("capturedTime").textContent = `Captured: ${toIST(data.captured_at)}`;
    }

    function renderScriptList(scripts) {
      const tbody = document.getElementById("scriptListBody");
      const countEl = document.getElementById("listCount");

      // Filter
      let filtered = scripts;
      if (currentFilter !== "all") {
        filtered = filtered.filter(s => (s.trend || "UNCHANGED") === currentFilter);
      }

      // Search
      if (currentSearch) {
        const search = currentSearch.toLowerCase();
        filtered = filtered.filter(s =>
          (s.symbol || "").toLowerCase().includes(search) ||
          (s.industry || "").toLowerCase().includes(search)
        );
      }

      // Sort
      filtered.sort((a, b) => {
        let aVal = a[currentSort.field];
        let bVal = b[currentSort.field];
        if (typeof aVal === "number" && typeof bVal === "number") {
          return currentSort.dir === "asc" ? aVal - bVal : bVal - aVal;
        }
        aVal = String(aVal || "");
        bVal = String(bVal || "");
        return currentSort.dir === "asc"
          ? aVal.localeCompare(bVal)
          : bVal.localeCompare(aVal);
      });

      countEl.textContent = `${filtered.length} script${filtered.length !== 1 ? "s" : ""}`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-state-icon">&#128269;</div>
                <div class="empty-state-text">No scripts match your search criteria</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const changeClass = Number(item.change) > 0 ? "pos" : Number(item.change) < 0 ? "neg" : "";
        const changePctClass = Number(item.change_pct) > 0 ? "pos" : Number(item.change_pct) < 0 ? "neg" : "";

        return `
          <tr>
            <td>${escHtml(item.symbol || "-")}</td>
            <td>${escHtml(item.industry || "-")}</td>
            <td>${fmt2(item.ltp)}</td>
            <td>${fmt2(item.previous_close)}</td>
            <td class="${changeClass}">${fmt2(item.change)}</td>
            <td class="${changePctClass}">${item.change_pct === null || item.change_pct === undefined ? "-" : `${fmt2(item.change_pct)}%`}</td>
          </tr>
        `;
      }).join("");
    }

    function exportToCSV() {
      let filtered = allScripts;
      if (currentFilter !== "all") {
        filtered = filtered.filter(s => (s.trend || "UNCHANGED") === currentFilter);
      }
      if (currentSearch) {
        const search = currentSearch.toLowerCase();
        filtered = filtered.filter(s =>
          (s.symbol || "").toLowerCase().includes(search) ||
          (s.industry || "").toLowerCase().includes(search)
        );
      }

      const headers = ["Symbol", "Industry", "LTP", "Previous Close", "Change", "Change %"];
      const rows = filtered.map(s => [
        s.symbol || "",
        s.industry || "",
        s.ltp || "",
        s.previous_close || "",
        s.change || "",
        s.change_pct || ""
      ]);

      const csvContent = [headers, ...rows]
        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `market_breadth_${new Date().toISOString().split("T")[0]}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function loadData() {
      try {
        const response = await fetch("/api/v1/script-snapshot/advance-decline", {
          credentials: "include"
        });
        const result = await response.json();

        if (result.success && result.data) {
          const data = result.data;
          updateMetrics(data);
          allScripts = Array.isArray(data.scripts) ? data.scripts : [];
          renderScriptList(allScripts);
        }
      } catch (error) {
        console.error("Failed to load market breadth data:", error);
        document.getElementById("scriptListBody").innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-state-icon">&#9888;</div>
                <div class="empty-state-text">Failed to load data. Please try again.</div>
              </div>
            </td>
          </tr>
        `;
      }
    }

    // Event listeners
    document.getElementById("searchInput").addEventListener("input", (e) => {
      currentSearch = e.target.value;
      renderScriptList(allScripts);
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderScriptList(allScripts);
      });
    });

    document.querySelectorAll(".script-list-table th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const field = th.dataset.sort;
        if (currentSort.field === field) {
          currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
        } else {
          currentSort.field = field;
          currentSort.dir = "asc";
        }
        renderScriptList(allScripts);
      });
    });

    document.getElementById("exportBtn").addEventListener("click", exportToCSV);

    // Initial load
    loadData();

    // Auto refresh every 30 seconds
    setInterval(loadData, 30000);

    // Spot data fetcher
    async function loadSpotData() {
      try {
        const res = await fetch("/api/v1/spot-data", { credentials: "include" });
        const result = await res.json();
        if (result.success && result.data) {
          const d = result.data;
          const navSpot = document.getElementById("navSpot");
          const navChange = document.getElementById("navChange");
          const navChangePct = document.getElementById("navChangePct");
          if (d.spot_price !== null && d.spot_price !== undefined) navSpot.textContent = fmt2(d.spot_price);
          if (navChange && d.change_from_prev_close !== null && d.change_from_prev_close !== undefined) {
            const v = Number(d.change_from_prev_close);
            navChange.textContent = (v >= 0 ? "+" : "") + fmt2(v);
            navChange.className = "nav-val " + (v >= 0 ? "pos" : "neg");
          }
          if (navChangePct && d.change_pct_from_prev_close !== null && d.change_pct_from_prev_close !== undefined) {
            const v = Number(d.change_pct_from_prev_close);
            navChangePct.textContent = (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
            navChangePct.className = "nav-val " + (v >= 0 ? "pos" : "neg");
          }
        }
      } catch (e) { console.error("Spot data fetch failed:", e); }
    }
    loadSpotData();
    setInterval(loadSpotData, 30000);
  </script>
</body>
</html>
